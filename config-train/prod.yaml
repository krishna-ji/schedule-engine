# Production-quality profile for long curriculum runs (1h+)
profile: prod
timesteps: 300000
max_generations: 200
max_steps: 80
population_size: 80
eval_episodes: 10
save_prefix: rl_agent_prod

# Parallel training - OPTIMIZED FOR STABILITY
parallel:
  n_envs: 8 # Use 8 envs (was: null/32 - too many caused freeze)
  use_subproc: true # True parallelism (no GIL)

# GPU acceleration
device: cuda # Force CUDA for production

# Debug logging (verbose environment progress)
debug_logging: true
debug_log_interval: 25 # Log every 25 steps
