[project]
name = "schedule-engine"
version = "1.0.0"
description = "University course scheduling engine using NSGA-II genetic algorithm with constraint-based optimization"
authors = [
    {name = "Krishna Acharya"},
    {name = "Dinanath Padhya"},
    {name = "Bipul Dahal"},
    {name = "claude kaka and copilot mama"}
]
readme = "README.md"
requires-python = "==3.12.*"
license = {text = "MIT"}
keywords = ["scheduling", "genetic-algorithm", "nsga-ii", "optimization", "timetabling"]

dependencies = [
    # Core dependencies - pinned to stable versions
    "deap==1.4.1",
    "pydantic==2.10.3",
    "pyyaml==6.0.2",
    "rich==13.9.4",
    "tqdm==4.67.1",
    # Scientific computing - Windows-compatible versions (no Fortran required)
    "numpy==1.26.4",          # Last stable 1.x before 2.0 breaking changes
    "scipy==1.11.4",          # Last version with pre-built Windows wheels (no Fortran)
    "matplotlib==3.9.4",
    "seaborn==0.13.2",
    "pandas==2.2.3",
    # System utilities
    "psutil==6.1.1",
    "plotext==5.3.2",
    # Phase 2: RL Integration - pinned to tested versions
    "gymnasium==0.29.1",
    "stable-baselines3==2.3.2",
    # PyTorch with CUDA 12.1 support for GPU acceleration (from pytorch-cu121 index)
    "torch==2.4.1+cu121",
    "torchvision==0.19.1+cu121",
    "tensorboard==2.18.0",
    "pymoo==0.6.1.3",
    "ipykernel>=7.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-cov==6.0.0",
    "black==24.10.0",
    "ruff==0.8.4",
    "mypy==1.13.0",
    "pre-commit==4.0.1",
    "types-pyyaml==6.0.12.20240917",
]
analysis = [
    "pandas>=2.0.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0"
]

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"

[tool.uv]
index-strategy = "unsafe-best-match"

[tool.uv.sources]
torch = { index = "pytorch-cu121" }
torchvision = { index = "pytorch-cu121" }

[tool.pytest.ini_options]
pythonpath = ["tests"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"
exclude = [
    ".venv",
    "__pycache__",
    "output",
    "notebooks",
    "logs",
    ".pytest_cache",
    "data",
    "data/**",
]

[tool.ruff.lint]
# Enable recommended rule sets
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort (import sorting)
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]

ignore = [
    "E402",   # Module level import not at top of file (for console init)
    "E501",   # Line too long (handled by Black, many are comments/strings)
    "N812",   # Lowercase imported as non-lowercase (DEAP conventions)
    "SIM108", # Use ternary operator (sometimes less readable)
]

# Allow autofix for all enabled rules
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # Unused imports in __init__ files
"test/**/*.py" = ["S101"] # Use of assert in tests

[tool.ruff.lint.isort]
known-first-party = ["src"]
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]

[tool.black]
line-length = 88
target-version = ['py312']
exclude = '''
/(
    \.venv
  | __pycache__
  | output
  | notebooks
  | logs
  | \.pytest_cache
)/
'''
# Enable preview features for better formatting
preview = true

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
files = ["src"]
explicit_package_bases = false
exclude = [
    "output/",
    "logs/",
    "notebooks/",
    "configs/",
    "scripts/",
    "test/"
]

[[tool.mypy.overrides]]
module = ["src.utils.*"]
disallow_untyped_defs = true
disallow_incomplete_defs = true

[[tool.mypy.overrides]]
module = ["src.config.*"]
disallow_untyped_defs = true
disallow_incomplete_defs = true

[[tool.mypy.overrides]]
module = ["src.constants", "src.exceptions"]
disallow_untyped_defs = true
disallow_incomplete_defs = true

[[tool.mypy.overrides]]
module = ["src.domain.*"]
disallow_untyped_defs = true
disallow_incomplete_defs = true

[[tool.mypy.overrides]]
module = ["src.io.*"]
disallow_untyped_defs = true
disallow_incomplete_defs = true

[[tool.mypy.overrides]]
module = ["src.constraints.*"]
disallow_untyped_defs = true
disallow_incomplete_defs = true

[[tool.mypy.overrides]]
module = ["src.io.export.*"]
disallow_untyped_defs = true
disallow_incomplete_defs = true

[[tool.mypy.overrides]]
module = ["src.metrics.*"]
disallow_untyped_defs = true
disallow_incomplete_defs = true

# Relaxed checking for complex GA/RL integration with DEAP's dynamic types
[[tool.mypy.overrides]]
module = ["src.ga.scheduler"]
# Keep basic type checking but allow flexibility for DEAP/SB3 integration
disallow_untyped_defs = false
disallow_incomplete_defs = false
# Suppress common dynamic typing issues
disable_error_code = ["attr-defined", "arg-type", "union-attr", "assignment"]

