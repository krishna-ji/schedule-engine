[project]
name = "schedule-engine"
version = "1.0.0"
description = "University course scheduling engine using NSGA-II genetic algorithm with constraint-based optimization"
authors = [
    {name = "Krishna Acharya"},
    {name = "Dinanath Padhya"},
    {name = "Bipul Dahal"},
    {name = "claude kaka and copilot mama"}
]
readme = "README.md"
requires-python = "==3.12.*"
license = {text = "MIT"}
keywords = ["scheduling", "genetic-algorithm", "nsga-ii", "optimization", "timetabling"]

dependencies = [
    # Core dependencies - pinned to stable versions
    "deap==1.4.1",
    "pydantic==2.10.3",
    "pyyaml==6.0.2",
    "rich==13.9.4",
    "tqdm==4.67.1",
    
    # Scientific computing - Windows-compatible versions (no Fortran required)
    "numpy==1.26.4",          # Last stable 1.x before 2.0 breaking changes
    "scipy==1.11.4",          # Last version with pre-built Windows wheels (no Fortran)
    "matplotlib==3.9.4",
    "seaborn==0.13.2",
    "pandas==2.2.3",
    
    # System utilities
    "psutil==6.1.1",
    "plotext==5.3.2",
    
    # Phase 2: RL Integration - pinned to tested versions
    "gymnasium==0.29.1",
    "stable-baselines3==2.3.2",
    # PyTorch with CUDA 12.1 support for GPU acceleration (from pytorch-cu121 index)
    "torch==2.4.1+cu121",
    "torchvision==0.19.1+cu121",
    "tensorboard==2.18.0",
    "pymoo==0.6.1.3",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-cov==6.0.0",
    "black==24.10.0",
    "ruff==0.8.4",
    "mypy==1.13.0",
]

[project.scripts]
# ==============================================================================
#  INTERACTIVE LAUNCHER
# ==============================================================================
launcher = "scripts.interactive_launcher:main"        # Interactive menu with all commands
run = "scripts.interactive_launcher:main"             # Alias for launcher

# ==============================================================================
#  1. RL GUIDED HYPERHEURISTIC (Mode 5)
# ==============================================================================
train-rl = "src.rl.training.train_script:main"        # Train RL agent
train-curriculum = "src.rl.training.curriculum:main"  # Curriculum learning
test-rl = "main:main_rl_test"                         # Test RL-guided (30 gens)
prod-rl = "main:main_rl_prod"                         # Prod RL-guided (2000 gens)

# ==============================================================================
#  2. NSGA-II ONLY (Mode 1 - Baseline)
# ==============================================================================
test-nsga = "main:main_baseline_test"                 # Test Pure NSGA-II
prod-nsga = "main:main_baseline_prod"                 # Prod Pure NSGA-II

# ==============================================================================
#  3. NSGA-II + REPAIR (Mode 2)
# ==============================================================================
test-repair = "main:main_repairs_test"                # Test NSGA + Repairs
prod-repair = "main:main_repairs_prod"                # Prod NSGA + Repairs

# ==============================================================================
#  4. NSGA-II + REPAIR + LOCAL SEARCH (Mode 4 - Full)
# ==============================================================================
test-ls = "main:main_full_test"                       # Test Full (Repairs + Heuristics + LNS)
prod-ls = "main:main_full_prod"                       # Prod Full (Repairs + Heuristics + LNS)

# ==============================================================================
#  5. ROUND ROBIN HEURISTICS (Mode 6)
# ==============================================================================
test-roundrobin = "main:main_roundrobin_test"         # Test Round Robin
prod-roundrobin = "main:main_roundrobin_prod"         # Prod Round Robin

# ==============================================================================
#  DIAGNOSTICS & UTILITIES
# ==============================================================================
diagnose-system = "scripts.cli:diagnose_system"       # Full system check
clean-output = "scripts.cli:clean_output"             # Clean old output files
list-experiments = "scripts.cli:list_experiments"     # List all available experiments

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"

[tool.uv]
index-strategy = "unsafe-best-match"

[tool.uv.sources]
torch = { index = "pytorch-cu121" }
torchvision = { index = "pytorch-cu121" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "pytest==8.3.4",
    "pytest-cov==6.0.0",
    "black==24.10.0",
    "ruff==0.8.4",
    "mypy==1.13.0",
]

[tool.ruff]
line-length = 88
target-version = "py311"
exclude = [
    ".venv",
    "__pycache__",
    "output",
    "notebook",
]
# Extend-ignore allows us to selectively disable rules that are kept at the
# organization level but create false positives in localized contexts (e.g.,
# console initialization ordering). Keep this minimal and document any changes.

[tool.ruff.lint]
extend-ignore = ["E402"]

[tool.black]
line-length = 88
target-version = ['py311']
exclude = '''
/(
    \.venv
  | __pycache__
  | output
  | notebook
)/
'''

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
