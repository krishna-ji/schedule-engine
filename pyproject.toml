[project]
name = "schedule-engine"
version = "1.0.0"
description = "University course scheduling engine using NSGA-II genetic algorithm with constraint-based optimization"
authors = [
    {name = "Krishna Acharya"},
    {name = "Dinanath Padhya"},
    {name = "Bipul Dahal"},
    {name = "claude kaka and copilot mama"}
]
readme = "README.md"
requires-python = "==3.12.*"
license = {text = "MIT"}
keywords = ["scheduling", "genetic-algorithm", "nsga-ii", "optimization", "timetabling"]

dependencies = [
    # Core dependencies - pinned to stable versions
    "deap==1.4.1",
    "pydantic==2.10.3",
    "pyyaml==6.0.2",
    "rich==13.9.4",
    "tqdm==4.67.1",
    
    # Scientific computing - Windows-compatible versions (no Fortran required)
    "numpy==1.26.4",          # Last stable 1.x before 2.0 breaking changes
    "scipy==1.11.4",          # Last version with pre-built Windows wheels (no Fortran)
    "matplotlib==3.9.4",
    "seaborn==0.13.2",
    "pandas==2.2.3",
    
    # System utilities
    "psutil==6.1.1",
    "plotext==5.3.2",
    
    # Phase 2: RL Integration - pinned to tested versions
    "gymnasium==0.29.1",
    "stable-baselines3==2.3.2",
    # PyTorch with CUDA 12.1 support (install from PyTorch index)
    # Use: uv pip install torch==2.4.1 --index-url https://download.pytorch.org/whl/cu121
    "torch==2.4.1",
    "tensorboard==2.18.0",
    "pymoo==0.6.1.3",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-cov==6.0.0",
    "black==24.10.0",
    "ruff==0.8.4",
    "mypy==1.13.0",
]

[project.scripts]
# ==============================================================================
# MAIN ENGINE ENTRY POINTS
# ==============================================================================
schedule-engine = "main:main"

# Environment shortcuts
prod = "main:main_prod"
test = "main:main_test"

# ==============================================================================
# RUNTIME MODES (10 Progressive Modes)
# ==============================================================================
# Baseline & Core Modes (1-4)
baseline = "main:main_baseline"          # Mode 1: Pure NSGA-II
repairs = "main:main_repairs"            # Mode 2: NSGA-II + IGLS repairs
heuristics = "main:main_heuristics"      # Mode 3: NSGA-II + repairs + 19 heuristics
full = "main:main_full"                  # Mode 4: Full GA (best non-RL)

# Basic RL Modes (5-6)
rl = "main:main_rl"                      # Mode 5: RL-guided heuristic selection
roundrobin = "main:main_roundrobin"      # Mode 6: Fixed round-robin rotation

# Advanced RL Modes (7-10) - Phase 3
specialists = "main:main_specialists"    # Mode 7: RL with specialist agents
archive = "main:main_archive"            # Mode 8: Archive-based diversity
hierarchical = "main:main_hierarchical"  # Mode 9: Hierarchical RL (two-level)
multiagent = "main:main_multiagent"      # Mode 10: Rank-based multi-agent RL

# ==============================================================================
# RL TRAINING & MODEL MANAGEMENT
# ==============================================================================
train = "src.rl.training.train_script:main"
train-curriculum = "src.rl.training.curriculum:main"
select-checkpoint = "scripts.cli:select_checkpoint"
promote-model = "scripts.cli:promote_model"
generate-validation = "scripts.cli:generate_validation"

# ==============================================================================
# DIAGNOSTICS & SYSTEM CHECKS
# ==============================================================================
diagnose-gpu = "scripts.cli:diagnose_gpu"
test-dashboard = "scripts.cli:test_dashboard"
check-data = "scripts.cli:check_data"
verify-config = "scripts.cli:verify_config"
verify-enhancements = "scripts.cli:verify_enhancements"

# ==============================================================================
# BENCHMARKING & PERFORMANCE
# ==============================================================================
benchmark-gpu = "scripts.cli:benchmark_gpu"
benchmark-lns = "scripts.cli:benchmark_lns"
benchmark-constraints = "scripts.cli:benchmark_constraints"

# ==============================================================================
# CONFIGURATION UTILITIES
# ==============================================================================
show-config = "scripts.cli:show_config"      # All constraints
show-repair = "scripts.cli:show_repair"       # Repair system config
show-soft = "scripts.cli:show_soft"           # Soft constraints only
show-time = "scripts.cli:show_time"           # Time system config

# ==============================================================================
# DEVELOPMENT UTILITIES
# ==============================================================================
tensorboard = "scripts.cli:tensorboard"       # Start TensorBoard server
git-squash = "scripts.cli:git_squash"         # Interactive commit squashing
refactor-csv = "scripts.cli:refactor_csv"     # CSV export refactoring

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "pytest==8.3.4",
    "pytest-cov==6.0.0",
    "black==24.10.0",
    "ruff==0.8.4",
    "mypy==1.13.0",
]

[tool.ruff]
line-length = 88
target-version = "py311"
exclude = [
    ".venv",
    "__pycache__",
    "output",
    "notebook",
]
# Extend-ignore allows us to selectively disable rules that are kept at the
# organization level but create false positives in localized contexts (e.g.,
# console initialization ordering). Keep this minimal and document any changes.

[tool.ruff.lint]
extend-ignore = ["E402"]

[tool.black]
line-length = 88
target-version = ['py311']
exclude = '''
/(
    \.venv
  | __pycache__
  | output
  | notebook
)/
'''

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
