[project]
name = "schedule-engine"
version = "1.0.0"
description = "University course scheduling engine using NSGA-II genetic algorithm with constraint-based optimization"
authors = [
    {name = "Krishna Acharya"},
    {name = "Dinanath Padhya"},
    {name = "Bipul Dahal"},
    {name = "claude kaka and copilot mama"}
]
readme = "README.md"
requires-python = "==3.12.*"
license = {text = "MIT"}
keywords = ["scheduling", "genetic-algorithm", "nsga-ii", "optimization", "timetabling"]

dependencies = [
    # Core dependencies - pinned to stable versions
    "deap==1.4.1",
    "pydantic==2.10.3",
    "pyyaml==6.0.2",
    "rich==13.9.4",
    "tqdm==4.67.1",
    
    # Scientific computing - Windows-compatible versions (no Fortran required)
    "numpy==1.26.4",          # Last stable 1.x before 2.0 breaking changes
    "scipy==1.11.4",          # Last version with pre-built Windows wheels (no Fortran)
    "matplotlib==3.9.4",
    "seaborn==0.13.2",
    "pandas==2.2.3",
    
    # System utilities
    "psutil==6.1.1",
    "plotext==5.3.2",
    
    # Phase 2: RL Integration - pinned to tested versions
    "gymnasium==0.29.1",
    "stable-baselines3==2.3.2",
    # PyTorch with CUDA 12.1 support for GPU acceleration (from pytorch-cu121 index)
    "torch==2.4.1+cu121",
    "torchvision==0.19.1+cu121",
    "tensorboard==2.18.0",
    "pymoo==0.6.1.3",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-cov==6.0.0",
    "black==24.10.0",
    "ruff==0.8.4",
    "mypy==1.13.0",
]
analysis = [
    "pandas>=2.0.0", 
    "matplotlib>=3.7.0", 
    "seaborn>=0.12.0"
]

[project.scripts]
# ==================
# UNIFIED CLI LAUNCHER
# Convention: Main commands (0-99+) = numbers, Helpers (a-z) = letters
# Usage: uv run <command> --<profile>
# Profiles: --test (smoke), --med (medium), --prod (full)
# ==================

# Interactive launcher (TUI menu)
launcher = "scripts.launcher:main_interactive"
run = "scripts.launcher:main_interactive"

# ==================
# PROGRESSIVE MODE EXPERIMENTS (A→E: Increasing Complexity)
# ==================
# Mode A: Pure NSGA-II                           [repairs: NO,  memetic: NO,  heuristics: NO]
# Mode B: + Memetic local search                 [repairs: YES, memetic: YES, heuristics: NO]
# Mode C: + Round-robin (heuristics + repair)    [repairs: YES (round-robin), memetic: NO, heuristics: YES (fixed)]
# Mode D: + Adaptive heuristics                  [repairs: YES, memetic: NO,  heuristics: YES (adaptive)]
# Mode E: + RL-guided (deploys all techniques)   [repairs: YES, memetic: YES, heuristics: YES (RL-controlled)]

baseline = "scripts.launcher:main_baseline"           # Mode A: Pure NSGA-II
memetic = "scripts.launcher:main_memetic"             # Mode B: + Memetic local search
roundrobin = "scripts.launcher:main_roundrobin"       # Mode C: + Round-robin heuristics
adaptive = "scripts.launcher:main_adaptive"           # Mode D: + Adaptive selection
rl = "scripts.launcher:main_rl"                       # Mode E: + RL-guided

# RL Training
train-rl = "scripts.launcher:main_train_rl"           # RL Agent Training

# ==================
# HELPER COMMANDS: Utilities & Analysis
# ==================

analyze-results = "scripts.analysis.compare_experiments:main"  # Generate comparison plots
clean = "scripts.launcher:main_clean"                 # Clean output directory
diagnose = "scripts.launcher:main_diagnose"           # System diagnostics
list-experiments = "scripts.launcher:main_list"       # List experiment history
organize-output = "scripts.utilities.organize_output:main"  # Reorganize output structure

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"

[tool.uv]
index-strategy = "unsafe-best-match"

[tool.uv.sources]
torch = { index = "pytorch-cu121" }
torchvision = { index = "pytorch-cu121" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]



[tool.ruff]
line-length = 88
target-version = "py311"
exclude = [
    ".venv",
    "__pycache__",
    "output",
    "notebook",
]
# Extend-ignore allows us to selectively disable rules that are kept at the
# organization level but create false positives in localized contexts (e.g.,
# console initialization ordering). Keep this minimal and document any changes.

[tool.ruff.lint]
extend-ignore = ["E402"]

[tool.black]
line-length = 88
target-version = ['py311']
exclude = '''
/(
    \.venv
  | __pycache__
  | output
  | notebook
)/
'''

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
