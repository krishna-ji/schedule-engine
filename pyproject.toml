[project]
name = "schedule-engine"
version = "1.0.0"
description = "University course scheduling engine using NSGA-II genetic algorithm with constraint-based optimization"
authors = [
    {name = "Krishna Acharya"},
    {name = "Dinanath Padhya"},
    {name = "Bipul Dahal"},
    {name = "claude kaka and copilot mama"}
]
readme = "README.md"
requires-python = "==3.12.*"
license = {text = "MIT"}
keywords = ["scheduling", "genetic-algorithm", "nsga-ii", "optimization", "timetabling"]

dependencies = [
    # Core dependencies - pinned to stable versions
    "deap==1.4.1",
    "pydantic==2.10.3",
    "pyyaml==6.0.2",
    "rich==13.9.4",
    "tqdm==4.67.1",
    # Scientific computing - Windows-compatible versions (no Fortran required)
    "numpy==1.26.4",          # Last stable 1.x before 2.0 breaking changes
    "scipy==1.11.4",          # Last version with pre-built Windows wheels (no Fortran)
    "matplotlib==3.9.4",
    "seaborn==0.13.2",
    "pandas==2.2.3",
    # System utilities
    "psutil==6.1.1",
    "plotext==5.3.2",
    # Phase 2: RL Integration - pinned to tested versions
    "gymnasium==0.29.1",
    "stable-baselines3==2.3.2",
    # PyTorch with CUDA 12.1 support for GPU acceleration (from pytorch-cu121 index)
    "torch==2.4.1+cu121",
    "torchvision==0.19.1+cu121",
    "tensorboard==2.18.0",
    "pymoo==0.6.1.3",
    "ipykernel>=7.1.0",
    # Phase 3: CP-SAT decomposition repair
    "ortools>=9.8",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-cov==6.0.0",
    "black==24.10.0",
    "ruff==0.8.4",
    "mypy==1.13.0",
    "pre-commit==4.0.1",
    "types-pyyaml==6.0.12.20240917",
]
analysis = [
    "pandas>=2.0.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0"
]

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"

[tool.uv]
index-strategy = "unsafe-best-match"

[tool.uv.sources]
torch = { index = "pytorch-cu121" }
torchvision = { index = "pytorch-cu121" }

[tool.pytest.ini_options]
pythonpath = ["tests"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"
exclude = [
    ".venv",
    "__pycache__",
    "output",
    "notebooks",
    "logs",
    ".pytest_cache",
    "data",
    "data/**",
]

[tool.ruff.lint]
# Comprehensive rule sets for thorough linting
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort (import sorting)
    "N",    # pep8-naming
    "UP",   # pyupgrade (modernize syntax)
    "B",    # flake8-bugbear (common bugs)
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "RUF",  # Ruff-specific rules
    "PTH",  # flake8-use-pathlib
    "PERF", # Perflint (performance anti-patterns)
    "PL",   # Pylint subset (errors, warnings, refactor)
    "TC",   # flake8-type-checking (move imports behind TYPE_CHECKING)
    "T20",  # flake8-print (catch stray prints)
    "PIE",  # flake8-pie (misc. lints)
    "RET",  # flake8-return (return statement issues)
    "ICN",  # flake8-import-conventions
    "A",    # flake8-builtins (shadowing builtins)
    "FLY",  # flynt (f-string conversion)
    "LOG",  # flake8-logging
]

ignore = [
    "E402",    # Module level import not at top of file (console init)
    "E501",    # Line too long (handled by Black)
    "N812",    # Lowercase imported as non-lowercase (DEAP conventions)
    "SIM108",  # Use ternary operator (sometimes less readable)
    "PLR0913", # Too many arguments to function call
    "PLR2004", # Magic value in comparison
    "PLR0911", # Too many return statements
    "PLR0912", # Too many branches
    "PLR0915", # Too many statements
    "PLC0415", # Import not at top-level — lazy imports used intentionally
    "T201",    # print() found — allow for CLI/debug scripts
    "RET504",  # Unnecessary assignment before return
    "PLW2901", # Overwriting loop variable
]

# Allow autofix for all enabled rules
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # Unused imports in __init__ files
"test/**/*.py" = ["S101"] # Use of assert in tests
# Relax rules for script directories
"runs/*.py" = [
    "N806",    # non-lowercase-variable-in-function (CONSTANTS are OK in scripts)
    "F821",    # undefined-name (scripts may have dynamic imports)
    "F401",    # unused-import (scripts may import for side effects)
    "PLW0603", # global-statement (scripts may need globals)
    "T201",    # print statements (scripts need output)
    "PTH123",  # builtin-open (scripts can use open())
    "RUF002", "RUF003", "RUF001",  # unicode chars (scripts may have special chars)
    "B007",    # unused-loop-control-variable (scripts may have simple loops)
    "PERF401", # manual-list-comprehension (scripts prioritize clarity)
    "SIM102",  # collapsible-if (scripts prioritize clarity over compactness)
]
"configs/*.py" = [
    "F821",    # undefined-name (config files may have dynamic refs)
    "F401",    # unused-import
    "T201",    # print statements
    "PTH123",  # builtin-open
    "RUF002", "RUF003", "RUF001",  # unicode chars
]
"scripts/*.py" = [
    "N806", "F821", "F401", "PLW0603", "T201", "PTH123", 
    "RUF002", "RUF003", "RUF001", "B007", "PERF401"
]
# Root level scripts
"*.py" = [
    "N806", "F821", "F401", "PLW0603", "T201", "PTH123",
    "RUF002", "RUF003", "RUF001", "B007", "PERF401"
]

[tool.ruff.lint.isort]
known-first-party = ["src"]
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]

[tool.black]
line-length = 88
target-version = ['py312']
exclude = '''
/(
    \.venv
  | __pycache__
  | output
  | notebooks
  | logs
  | \.pytest_cache
)/
'''
# Enable preview features for better formatting
preview = true

[tool.mypy]
python_version = "3.12"

# --- Strictness ---
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
no_implicit_optional = true
strict_equality = true
check_untyped_defs = true

# Start with typed-defs OFF globally, tighten per-module below
disallow_untyped_defs = false
disallow_incomplete_defs = false

# Allow gradual adoption — flip to false as you add stubs
ignore_missing_imports = true

# --- Scope ---
files = [
    "src", 
    "tests", 
    "configs", 
    "runs", 
    "*.py"
]
explicit_package_bases = true
exclude = [
    "output/",
    "logs/",
    "notebooks/",
]

# Per-module type checking rules
[[tool.mypy.overrides]]
module = ["runs.*", "configs.*", "scripts.*"]
# Relaxed rules for script directories
ignore_missing_imports = true
disable_error_code = [
    "var-annotated", "attr-defined", "arg-type", "call-arg", 
    "name-defined", "assignment", "no-any-return", "valid-type",
    "unreachable", "union-attr", "return-value"
]

[[tool.mypy.overrides]]
module = ["src.notebooks.*"]
# Notebooks are often experimental code
ignore_missing_imports = true
disable_error_code = ["misc", "no-any-return", "arg-type", "attr-defined"]

[[tool.mypy.overrides]]
module = ["tests.*"]
# Relaxed rules for tests
ignore_missing_imports = true
disable_error_code = [
    "attr-defined", "arg-type", "call-arg", "var-annotated",
    "comparison-overlap", "list-item", "misc", "union-attr"
]

[[tool.mypy.overrides]]
module = ["instance_config", "verify_schedule_index", "main"]
# Root level files
ignore_missing_imports = true
disable_error_code = [
    "var-annotated", "attr-defined", "arg-type", "call-arg", 
    "name-defined", "assignment", "no-any-return", "valid-type",
    "unreachable", "union-attr", "return-value"
]

[[tool.mypy.overrides]]
module = ["*.py"]  # Root level files
ignore_missing_imports = true
disable_error_code = [
    "var-annotated", "attr-defined", "arg-type", "call-arg", 
    "name-defined", "assignment", "no-any-return", "valid-type",
    "unreachable", "union-attr", "return-value"
]

[[tool.mypy.overrides]]
module = ["src.utils.*"]
disallow_untyped_defs = true
disallow_incomplete_defs = true

[[tool.mypy.overrides]]
module = ["src.config.*"]
disallow_untyped_defs = true
disallow_incomplete_defs = true

[[tool.mypy.overrides]]
module = ["src.constants", "src.exceptions"]
disallow_untyped_defs = true
disallow_incomplete_defs = true

[[tool.mypy.overrides]]
module = ["src.domain.*"]
disallow_untyped_defs = true
disallow_incomplete_defs = true

[[tool.mypy.overrides]]
module = ["src.io.*"]
disallow_untyped_defs = true
disallow_incomplete_defs = true

[[tool.mypy.overrides]]
module = ["src.constraints.*"]
disallow_untyped_defs = true
disallow_incomplete_defs = true

[[tool.mypy.overrides]]
module = ["src.io.export.*"]
disallow_untyped_defs = true
disallow_incomplete_defs = true

[[tool.mypy.overrides]]
module = ["src.metrics.*"]
disallow_untyped_defs = true
disallow_incomplete_defs = true

# Relaxed checking for complex GA/RL integration with DEAP's dynamic types
[[tool.mypy.overrides]]
module = ["src.ga.scheduler"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disable_error_code = ["attr-defined", "arg-type", "union-attr", "assignment", "unreachable"]

# RL gym env uses a custom Logger wrapper with non-standard API
[[tool.mypy.overrides]]
module = ["src.rl.gym_env.schedule_env"]
disable_error_code = ["attr-defined", "call-arg", "unreachable"]

# RL subsystem: dynamic SB3/gymnasium types
[[tool.mypy.overrides]]
module = ["src.rl.gym_env.action_space"]
disable_error_code = ["attr-defined"]

# Validator uses isinstance narrowing that mypy can't handle well
[[tool.mypy.overrides]]
module = ["src.io.validator", "src.io.export.violation_reporter"]
disable_error_code = ["unreachable", "misc", "comparison-overlap"]

# RL training modules with dynamic SB3 types
[[tool.mypy.overrides]]
module = [
    "src.rl.training.callbacks",
    "src.rl.training.trainer",
    "src.rl.deployment.inference",
    "src.rl.hybrid.hybrid_controller",
]
disable_error_code = ["unreachable", "unused-ignore"]

# GA modules with unreachable after exhaustive match
[[tool.mypy.overrides]]
module = [
    "src.ga.operators.fast_nsga2",
    "src.ga.metrics.violation_recorder",
    "src.ga.repair.selective_heuristic",
    "src.ga.repair.break_repair",
    "src.io.feasibility",
]
disable_error_code = ["unreachable"]

# TODO: Complete type annotations for validation package
# [[tool.mypy.overrides]]
# module = ["schedule_engine.validation.*"]
# disallow_untyped_defs = true
# disallow_incomplete_defs = true
