[project]
name = "schedule-engine"
version = "1.0.0"
description = "University course scheduling engine using NSGA-II genetic algorithm with constraint-based optimization"
authors = [
    {name = "Krishna Acharya"},
    {name = "Dinanath Padhya"},
    {name = "Bipul Dahal"},
    {name = "claude kaka and copilot mama"}
]
readme = "README.md"
requires-python = "==3.12.*"
license = {text = "MIT"}
keywords = ["scheduling", "genetic-algorithm", "nsga-ii", "optimization", "timetabling"]

dependencies = [
    # Core dependencies - pinned to stable versions
    "deap==1.4.1",
    "pydantic==2.10.3",
    "pyyaml==6.0.2",
    "rich==13.9.4",
    "tqdm==4.67.1",
    
    # Scientific computing - Windows-compatible versions (no Fortran required)
    "numpy==1.26.4",          # Last stable 1.x before 2.0 breaking changes
    "scipy==1.11.4",          # Last version with pre-built Windows wheels (no Fortran)
    "matplotlib==3.9.4",
    "seaborn==0.13.2",
    "pandas==2.2.3",
    
    # System utilities
    "psutil==6.1.1",
    "plotext==5.3.2",
    
    # Phase 2: RL Integration - pinned to tested versions
    "gymnasium==0.29.1",
    "stable-baselines3==2.3.2",
    # PyTorch with CUDA 12.1 support for GPU acceleration (from pytorch-cu121 index)
    "torch==2.4.1+cu121",
    "torchvision==0.19.1+cu121",
    "tensorboard==2.18.0",
    "pymoo==0.6.1.3",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-cov==6.0.0",
    "black==24.10.0",
    "ruff==0.8.4",
    "mypy==1.13.0",
]

[project.scripts]
# ==============================================================================
#  INTERACTIVE LAUNCHER
# ==============================================================================
launcher = "scripts.interactive_launcher:main"        # Interactive menu with all commands
run = "scripts.interactive_launcher:main"             # Alias for launcher

# ==============================================================================
# MAIN ENGINE ENTRY POINTS
# ==============================================================================
schedule-engine = "main:main"

# ==============================================================================
#  THESIS EXPERIMENTS - Core Comparisons
# ==============================================================================
# Use these commands for your thesis experiments (logical progression)
thesis-exp1-baseline = "main:main_baseline"           # Exp 1: Pure NSGA-II (baseline)
thesis-exp2-repairs = "main:main_repairs"             # Exp 2: + IGLS repair system
thesis-exp3-heuristics = "main:main_heuristics"       # Exp 3: + 19 heuristics (no local search)
thesis-exp4-local-search = "main:main_roundrobin"     # Exp 4: + LNS local search (round-robin)
thesis-exp5-rl = "main:main_rl"                       # Exp 5: + RL adaptive selection

# Quick shortcuts (same as above, shorter names)
exp1 = "main:main_baseline"
exp2 = "main:main_repairs"
exp3 = "main:main_heuristics"
exp4 = "main:main_roundrobin"
exp5 = "main:main_rl"

# ==============================================================================
#  ABLATION STUDIES - Isolate Component Contributions
# ==============================================================================
# These help understand "which part contributes what"
ablation-no-repairs = "main:main_baseline"            # Baseline (no repairs)
ablation-repairs-only = "main:main_repairs"           # Only repairs (no heuristics)
ablation-heuristics-no-ls = "main:main_heuristics"    # Heuristics without local search
ablation-local-search = "main:main_full"              # Full with local search

# ==============================================================================
# ENVIRONMENT CONTROLS
# ==============================================================================
# Quick test runs (30 generations, ~5 minutes)
test = "main:main_test"
test-baseline = "main:main_baseline"  # Will use --env test
test-repairs = "main:main_repairs"
test-heuristics = "main:main_heuristics"

# Production runs (2000 generations, 1.5-2.5 hours)
prod = "main:main_prod"
prod-baseline = "main:main_baseline"  # Will use --env prod
prod-repairs = "main:main_repairs"
prod-heuristics = "main:main_heuristics"

# ==============================================================================
#  ORIGINAL RUNTIME MODES (10 Progressive Modes)
# ==============================================================================
# Baseline & Core Modes (1-4)
baseline = "main:main_baseline"          # Mode 1: Pure NSGA-II
repairs = "main:main_repairs"            # Mode 2: NSGA-II + IGLS repairs
heuristics = "main:main_heuristics"      # Mode 3: NSGA-II + repairs + 19 heuristics
full = "main:main_full"                  # Mode 4: Full GA (best non-RL)

# Basic RL Modes (5-6)
rl = "main:main_rl"                      # Mode 5: RL-guided heuristic selection
roundrobin = "main:main_roundrobin"      # Mode 6: Fixed round-robin rotation

# Advanced RL Modes (7-10) - Phase 3
specialists = "main:main_specialists"    # Mode 7: RL with specialist agents
archive = "main:main_archive"            # Mode 8: Archive-based diversity
hierarchical = "main:main_hierarchical"  # Mode 9: Hierarchical RL (two-level)
multiagent = "main:main_multiagent"      # Mode 10: Rank-based multi-agent RL

# ==============================================================================
#  RL TRAINING & MODEL MANAGEMENT
# ==============================================================================
# Training commands for Experiment 5 (RL-guided)
train-rl = "src.rl.training.train_script:main"        # Train RL agent (100K timesteps)
train-rl-quick = "src.rl.training.train_script:main"  # Quick training (10K timesteps)
train-curriculum = "src.rl.training.curriculum:main"  # Curriculum learning
select-checkpoint = "scripts.cli:select_checkpoint"   # Choose best checkpoint
promote-model = "scripts.cli:promote_model"           # Promote to production
validate-rl = "scripts.cli:generate_validation"       # Validate RL model

# Legacy aliases
train = "src.rl.training.train_script:main"
generate-validation = "scripts.cli:generate_validation"

# ==============================================================================
#  RESULTS ANALYSIS & COMPARISON
# ==============================================================================
# Compare experiment results for thesis
compare-experiments = "scripts.cli:compare_experiments"  # Compare all thesis experiments
generate-thesis-plots = "scripts.cli:generate_plots"     # Generate thesis-ready plots
export-thesis-data = "scripts.cli:export_thesis_data"    # Export metrics to CSV/LaTeX
analyze-convergence = "scripts.cli:analyze_convergence"  # Convergence analysis
analyze-diversity = "scripts.cli:analyze_diversity"      # Diversity metrics

# ==============================================================================
#  DIAGNOSTICS & SYSTEM CHECKS
# ==============================================================================
diagnose-gpu = "scripts.cli:diagnose_gpu"
diagnose-system = "scripts.cli:diagnose_system"          # Full system check
test-dashboard = "scripts.cli:test_dashboard"
check-data = "scripts.cli:check_data"
verify-config = "scripts.cli:verify_config"
verify-enhancements = "scripts.cli:verify_enhancements"

# ==============================================================================
#  BENCHMARKING & PERFORMANCE
# ==============================================================================
benchmark-gpu = "scripts.cli:benchmark_gpu"
benchmark-lns = "scripts.cli:benchmark_lns"
benchmark-constraints = "scripts.cli:benchmark_constraints"
benchmark-all = "scripts.cli:benchmark_all"              # Run all benchmarks

# ==============================================================================
# CONFIGURATION UTILITIES
# ==============================================================================
show-config = "scripts.cli:show_config"      # All constraints
show-repair = "scripts.cli:show_repair"       # Repair system config
show-soft = "scripts.cli:show_soft"           # Soft constraints only
show-time = "scripts.cli:show_time"           # Time system config
list-experiments = "scripts.cli:list_experiments"        # List all available experiments

# ==============================================================================
# DEVELOPMENT UTILITIES
# ==============================================================================
tensorboard = "scripts.cli:tensorboard"       # Start TensorBoard server
git-squash = "scripts.cli:git_squash"         # Interactive commit squashing
refactor-csv = "scripts.cli:refactor_csv"     # CSV export refactoring
clean-output = "scripts.cli:clean_output"     # Clean old output files

# ==============================================================================
#  RUNTIME MODE ALIASES (Longer, self-clarified names)
# ==============================================================================
run-mode-1-baseline = "main:main_baseline"           # Mode 1: Pure NSGA-II (baseline)
run-mode-2-repairs = "main:main_repairs"             # Mode 2: NSGA-II + IGLS repairs
run-mode-3-heuristics = "main:main_heuristics"       # Mode 3: NSGA-II + repairs + 19 heuristics
run-mode-4-full = "main:main_full"                   # Mode 4: Full GA (best non-RL)
run-mode-5-rl-guided = "main:main_rl"                # Mode 5: RL-guided heuristic selection
run-mode-6-roundrobin = "main:main_roundrobin"       # Mode 6: Fixed round-robin rotation
run-mode-7-specialists = "main:main_specialists"     # Mode 7: RL with specialist agents
run-mode-8-archive = "main:main_archive"             # Mode 8: Archive-based diversity
run-mode-9-hierarchical = "main:main_hierarchical"   # Mode 9: Hierarchical RL (two-level)
run-mode-10-multiagent = "main:main_multiagent"      # Mode 10: Rank-based multi-agent RL

# ==============================================================================
#  TESTING COMMANDS
# ==============================================================================
run-test-smoke = "main:main_test"                    # Quick smoke test (30 gens)
run-test-baseline = "main:main_baseline"             # Test baseline mode
run-test-repairs = "main:main_repairs"               # Test repairs mode
run-test-heuristics = "main:main_heuristics"         # Test heuristics mode
run-test-full = "main:main_full"                     # Test full mode
run-test-rl = "main:main_rl"                         # Test RL mode

# ==============================================================================
#  PRODUCTION COMMANDS
# ==============================================================================
run-prod-full = "main:main_prod"                     # Full production run (2000 gens)
run-prod-baseline = "main:main_baseline"             # Prod baseline mode
run-prod-repairs = "main:main_repairs"               # Prod repairs mode
run-prod-heuristics = "main:main_heuristics"         # Prod heuristics mode
run-prod-rl = "main:main_rl"                         # Prod RL mode

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"

[tool.uv]
index-strategy = "unsafe-best-match"

[tool.uv.sources]
torch = { index = "pytorch-cu121" }
torchvision = { index = "pytorch-cu121" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "pytest==8.3.4",
    "pytest-cov==6.0.0",
    "black==24.10.0",
    "ruff==0.8.4",
    "mypy==1.13.0",
]

[tool.ruff]
line-length = 88
target-version = "py311"
exclude = [
    ".venv",
    "__pycache__",
    "output",
    "notebook",
]
# Extend-ignore allows us to selectively disable rules that are kept at the
# organization level but create false positives in localized contexts (e.g.,
# console initialization ordering). Keep this minimal and document any changes.

[tool.ruff.lint]
extend-ignore = ["E402"]

[tool.black]
line-length = 88
target-version = ['py311']
exclude = '''
/(
    \.venv
  | __pycache__
  | output
  | notebook
)/
'''

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
