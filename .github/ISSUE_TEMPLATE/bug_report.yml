name: Bug Report
description: Report a bug or unexpected behavior
title: "[BUG]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please provide detailed information to help us reproduce and fix it.

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: Clear and concise description of the bug
      placeholder: "The GA scheduler crashes when..."
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to Reproduce
      description: Detailed steps to reproduce the behavior
      placeholder: |
        1. Run command `uv run nsga --prod --name "test"`
        2. Wait for generation 50
        3. See error
      value: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should happen?
      placeholder: "GA should complete all generations without errors"
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happens?
      placeholder: "Program crashes with KeyError"
    validations:
      required: true

  - type: textarea
    id: error-logs
    attributes:
      label: Error Messages / Stack Trace
      description: Full error output (use ``` for code formatting)
      render: shell
      placeholder: |
        Traceback (most recent call last):
          File "...", line X, in <module>
            ...
        KeyError: 'instructor_id'

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: System information
      value: |
        - OS: [e.g., Windows 11, Ubuntu 22.04]
        - Python version: [e.g., 3.12.0]
        - UV version: [run `uv --version`]
        - Package versions: [run `uv pip list`]
        - GPU: [CUDA version if applicable]
    validations:
      required: true

  - type: textarea
    id: config
    attributes:
      label: Configuration
      description: Relevant config file contents (configs/*.yaml)
      render: yaml
      placeholder: |
        ga:
          ngen: 2000
          pop_size: 200

  - type: textarea
    id: data
    attributes:
      label: Input Data Characteristics
      description: Dataset statistics (# courses, groups, instructors, rooms)
      placeholder: |
        - Courses: 50
        - Groups: 10
        - Instructors: 20
        - Rooms: 15

  - type: dropdown
    id: runtime-mode
    attributes:
      label: Runtime Mode
      description: Which mode were you using?
      options:
        - Mode 1 - Pure NSGA-II baseline
        - Mode 2 - NSGA-II + repairs
        - Mode 3 - NSGA-II + heuristics
        - Mode 4 - Full GA
        - Mode 5 - RL-guided
        - Custom config
    validations:
      required: true

  - type: checkboxes
    id: reproducibility
    attributes:
      label: Reproducibility
      options:
        - label: Bug occurs consistently (100% reproduction rate)
        - label: Bug occurs intermittently (<100% reproduction rate)
        - label: Bug only occurs with specific data files
        - label: Bug only occurs on specific hardware (GPU/CPU)

  - type: textarea
    id: workaround
    attributes:
      label: Workaround (if any)
      description: Have you found a temporary solution?
      placeholder: "Disabling repair.stagnation_repair.enabled avoids the crash"

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Any other relevant information
      placeholder: "This started happening after commit abc123"
