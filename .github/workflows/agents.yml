name: Project Agents

on:
    workflow_dispatch:
        inputs:
            agent:
                description: "Agent definition to invoke"
                required: true
                type: choice
                options:
                    - thesis-generator
                    - documentation-manager
                    - unit-test-writer
                    - issue-triage
                    - experiment-manager
                    - constraint-validator
                    - rl-monitor
                    - release-assistant
                    - analytics-reporter
            arguments:
                description: "Optional extra arguments passed to the agent run command"
                required: false
                default: ""
                type: string

jobs:
    run-agent:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Python 3.12
              uses: actions/setup-python@v6
              with:
                  python-version: "3.12"

            - name: Install uv
              run: |
                  pip install uv

            - name: Sync dependencies
              run: |
                  uv sync --frozen

            - name: Resolve agent metadata
              id: agent-metadata
              run: |
                  agent_file=".agents/${{ github.event.inputs.agent }}.md"
                  if [ ! -f "$agent_file" ]; then
                    echo "::error::Agent metadata file $agent_file not found"
                    exit 1
                  fi

                  echo "agent_file=$agent_file" >> "$GITHUB_OUTPUT"

            - name: Run agent command
              env:
                  AGENT_FILE: ${{ steps.agent-metadata.outputs.agent_file }}
                  EXTRA_ARGS: ${{ github.event.inputs.arguments }}
              run: |
                  run_command=$(grep "^run_command:" "$AGENT_FILE" | sed 's/^run_command:[ ]*"\(.*\)"/\1/')
                  if [ -z "$run_command" ]; then
                    echo "::error::run_command not defined in $AGENT_FILE"
                    exit 1
                  fi

                  echo "Invoking agent command: $run_command $EXTRA_ARGS"
                  eval "$run_command $EXTRA_ARGS"

            - name: Upload outputs (if any)
              if: success()
              uses: actions/upload-artifact@v4
              with:
                  name: agent-output
                  path: |
                      docs/thesis/
                      docs/06-development/changelog/
                      docs/analytics/
                      output/
                  if-no-files-found: warn
