# ============================================================================
# BASE CONFIGURATION - Shared Settings
# ============================================================================
# All common settings shared across environments.
# Environment-specific configs (prod/notprod/test) only override what differs.

# Time Configuration
time:
  quantum_minutes: 60
  earliest_preferred_time: "08:00"
  latest_preferred_time: "18:00"
  midday_break_start: "12:00"
  midday_break_end: "13:00"
  max_session_coalescence: 3
  max_sessions_per_day: 6
  preferred_block_size_min: 2
  preferred_block_size_max: 3
  theory_isolated_penalty: 5
  theory_oversized_penalty_per_quantum: 2
  theory_max_excused_isolated: 1
  practical_fragmentation_penalty: 10

# I/O Paths
io:
  data_dir: data
  output_dir: output

# Calendar Display
calendar:
  show_instructor: true
  show_room: true
  show_group: true

# Parallel Processing
parallel:
  use_multiprocessing: true
  num_workers: 16 # USE ALL 16 LOGICAL PROCESSORS

# GA Settings (common - ngen/pop_size overridden per environment)
ga:
  cxpb: 0.75
  mutpb: 0.25
  elite_preservation: true
  elite_size: 0.1
  use_adaptive_probabilities: true
  use_constraint_guided_mutation: true
  population_strategy: hybrid
  validate_population_integrity: false

# Feasibility Checks
feasibility:
  enable_checks: true
  tolerance_margin: 0.05
  fail_on_infeasibility: false
  generate_report: true
  show_console_output: true
  save_report_on_success: true
  checks:
    instructor_workload:
      enabled: true
      severity: critical
    instructor_qualification_bottleneck:
      enabled: true
      severity: critical
    room_capacity_bottleneck:
      enabled: true
      severity: critical
    room_feature_bottleneck:
      enabled: true
      severity: critical
    group_pigeonhole:
      enabled: true
      severity: critical

# Hard Constraints
hard_constraints:
  student_group_exclusivity:
    enabled: true
    weight: 3.0
  instructor_exclusivity:
    enabled: true
    weight: 3.0
  instructor_qualifications:
    enabled: true
    weight: 3.0
  instructor_time_availability:
    enabled: true
    weight: 3.0
  room_suitability:
    enabled: true
    weight: 2.5
  room_exclusivity:
    enabled: true
    weight: 3.0
  room_time_availability:
    enabled: true
    weight: 2.5
  course_completeness:
    enabled: true
    weight: 2.0

# Soft Constraints
soft_constraints:
  student_schedule_compactness:
    enabled: true
    weight: 1.5
    gap_penalty_per_quantum: 2
  instructor_schedule_compactness:
    enabled: true
    weight: 1.0
    gap_penalty_per_quantum: 1
  student_lunch_break:
    enabled: true
    weight: 1.2
    distance_penalty_per_quantum: 2
  session_continuity:
    enabled: true
    weight: 2.0
  soft_weight_factor: 0.01

# IGLS Repair System (common settings)
repair:
  enabled: true
  apply_after_mutation: false
  apply_after_crossover: false
  selective_mode: true
  detection_strategy: hybrid
  recheck_after_repair: false
  max_iterations: 2
  memetic_mode: false
  elite_percentage: 0.05
  memetic_iterations: 1

  adaptive_repair:
    stagnation_trigger:
      enabled: false
    periodic_trigger:
      enabled: false

  stagnation_repair:
    enabled: true
    patience: 8
    min_generation: 12
    population_coverage: 0.4
    max_iterations: 15
    timeout_seconds: 120
    cooldown: 5

  selective_repair:
    enabled: true
    apply_probability: 0.4
    apply_after_mutation: true
    apply_after_crossover: true
    detection_strategy: hybrid

# LNS-IGLS Configuration
lns:
  enabled: false
  trigger_interval: 50
  stagnation_threshold: 10
  force_trigger_generations: [] # Force trigger on specific gens (e.g., [6, 50] for testing)
  trigger_before_igls: false # Run LNS before exhaustive search
  max_subproblem_size: 20
  min_subproblem_size: 4
  expand_neighborhood_hops: 0 # Expand conflict graph (0=disabled)
  igls_max_iterations: 500
  igls_time_limit: 5.0
  apply_to_best_n: 1
  enable_diagnostics: true # Log subproblem details

# Enhancements (all disabled)
enhancements:
  master_enabled: false
  memetic_mode: false
  increased_population: false
  frequent_repair: false
  hypermutation:
    enabled: false
    trigger_on_stagnation: false
    stagnation_window: 10
    duration_generations: 1
    mutation_rate: 0.5
  constraint_priorities:
    enabled: false
    availability_weight: 0.8
    overlap_weight: 0.15
    other_weight: 0.05
  greedy_initialization_percent: 0.0
  population_restart:
    enabled: false
    trigger_stagnation_gens: 50
    restart_percentage: 0.3
    min_interval_gens: 100
  violation_heatmap:
    enabled: false
    target_hot_genes: false
    top_n_hotspots: 5
    persistence_file: "violation_heatmap.json"
  multi_neighborhood:
    enabled: false
    max_combinations: 10
    fallback_to_single: true

# Heuristic Toolbox (Phase 1.5)
heuristics:
  # Construction heuristics - build schedules greedily
  construction:
    largest_degree_first:
      enabled: true # Graph coloring heuristic - schedule most conflicting courses first
      priority: 1
    most_constrained_first:
      enabled: true # MRV heuristic - schedule sessions with fewest options first
      priority: 2
    earliest_deadline_first:
      enabled: true # Priority scheduling - courses with more sessions/week first
      priority: 3

  # Perturbation heuristics - shake solutions to escape local optima
  perturbation:
    random_swap:
      enabled: true
      priority: 1
      swap_type: time # Options: time, room, both
      num_swaps: 1
    temporal_shift:
      enabled: true
      priority: 2
      delta: null # null = random, or specify fixed shift
      probability: 0.3
    room_shuffle:
      enabled: true
      priority: 3
      probability: 0.2
    instructor_reassign:
      enabled: true
      priority: 4
      probability: 0.15
      prefer_available: true
    multi_perturbation:
      enabled: true # Enable for aggressive diversification in RL
      priority: 5

  # Improvement heuristics - local search for refinement
  improvement:
    kempe_chain:
      enabled: true
      priority: 1
      max_iterations: 5
    ejection_chain:
      enabled: true
      priority: 2
      max_chain_length: 5
      max_iterations: 3
    variable_depth_search:
      enabled: true # Enable for production RL training
      priority: 3
      max_depth: 3
      max_iterations: 5

  # Diversity heuristics - maintain population diversity
  diversity:
    distance_preserving_crossover:
      enabled: true # Fixed: QuantumTimeSystem API updated
      priority: 1
      preserve_distance: 0.7
    crowding_mutation:
      enabled: true # Fixed: QuantumTimeSystem API + safe course lookups with .get()
      priority: 2
      intensity: 0.3
    niching_selection:
      enabled: true # Fixed: Individual-level operation for RL compatibility
      priority: 3
      niche_radius: 0.3
      select_count: 10
    adaptive_diversity_maintenance:
      enabled: true # Fixed: QuantumTimeSystem API + individual-level operation
      priority: 4
      diversity_threshold: 0.2

  # Meta-heuristics - high-level search strategies
  meta:
    variable_neighborhood_descent:
      enabled: true # Systematic neighborhood exploration for local optimization
      priority: 1
      max_neighborhoods: 3
      max_iterations: 5
    iterated_local_search:
      enabled: true # Perturbation + local search cycles for global search
      priority: 2
      num_iterations: 5
      perturbation_strength: 0.3
    adaptive_large_neighborhood:
      enabled: true # Dynamic destroy-repair patterns for diversification
      priority: 3
      num_iterations: 10
      initial_destroy_rate: 0.3
    guided_local_search:
      enabled: true # Penalty-based guidance to escape local optima
      priority: 4
      num_iterations: 10
      penalty_factor: 0.1

# RL Integration (Phase 2)
rl:
  # Master killswitch
  enabled: false # Set to true to enable RL integration

  # Mode selection
  mode: disabled # Options: disabled, training, inference, hybrid

  # Environment configuration
  environment:
    max_steps_per_episode: 20 # RL steps per episode (reduced for faster training)
    observation_history_size: 10 # Recent heuristic applications to track
    render_mode: null # Options: null, "ansi", "human"

  # State representation (ENHANCEMENT #2)
  state:
    type: constraint_specific # Options: aggregated, constraint_specific
    enable_constraint_breakdown: true # Include per-constraint violations (8 hard + 4 soft = 12 features)
    history_size: 10 # Recent heuristic applications to track
    normalize: true # Normalize features to [0, 1]

  # Reward function (ENHANCEMENT #1)
  reward:
    type: scalar # Options: scalar, hypervolume, decomposed, adaptive
    normalize: true # Normalize rewards to [-1, 1]

    # Scalar reward weights (type=scalar)
    scalar:
      hard_weight: 100.0 # Weight for hard violation improvement
      soft_weight: 1.0 # Weight for soft violation improvement
      cost_weight: 0.01 # Weight for action cost penalty

    # Hypervolume reward (type=hypervolume)
    hypervolume:
      reference_point: [100.0, 1000.0] # Reference point for HV calculation [hard, soft]
      min_improvement: 0.01 # Minimum HV change to count as reward

    # Decomposed reward (type=decomposed)
    decomposed:
      weight_vector: [0.5, 0.5] # Weight vector [w_hard, w_soft] (should sum to 1.0)
      ideal_point: [0.0, 0.0] # Ideal point [z_hard*, z_soft*] (updated dynamically)
      scalarization: tchebycheff # Options: tchebycheff, weighted_sum

    # Adaptive reward (type=adaptive)
    adaptive:
      strategy: feasibility # Options: feasibility, progress, stagnation
      initial_hard_weight: 100.0 # Starting weight for hard violations
      initial_soft_weight: 1.0 # Starting weight for soft violations
      adaptation_rate: 0.1 # How quickly to adapt weights (0-1)

  # Agent configuration
  agent:
    type: ppo # Options: ppo, dqn, random
    model_path: models/rl_agents/best_model.zip # Path to trained model
    device: cuda # Options: auto, cpu, cuda (CUDA enabled for 3-5x training speedup)

    # PPO-specific hyperparameters
    ppo:
      learning_rate: 0.0003
      n_steps: 8192
      batch_size: 512
      n_epochs: 20
      gamma: 0.99 # Discount factor
      gae_lambda: 0.95
      clip_range: 0.2
      ent_coef: 0.01 # Entropy coefficient for exploration
      vf_coef: 0.5 # Value function coefficient
      max_grad_norm: 0.5

    # DQN-specific hyperparameters
    dqn:
      learning_rate: 0.0001
      buffer_size: 100000
      learning_starts: 1000
      batch_size: 32
      tau: 0.005
      gamma: 0.99
      exploration_fraction: 0.1
      exploration_initial_eps: 1.0
      exploration_final_eps: 0.05

  # Training configuration
  training:
    total_timesteps: 100000 # Total training steps
    checkpoint_interval: 10000 # Save checkpoint every N steps
    evaluation_interval: 5000 # Evaluate every N steps
    tensorboard_log: logs/tensorboard # TensorBoard log directory
    checkpoint_dir: models/rl_agents/checkpoints # Checkpoint directory
    save_dir: models/rl_agents # Model checkpoint directory
    verbose: 1 # Logging verbosity (0=none, 1=info, 2=debug)

    # Curriculum learning (Phase 2.2)
    curriculum:
      - name: "easy"
        enabled: true
        num_episodes: 200
        max_generations: 100
        checkpoint_every: 25
        validation_episodes: 5
        sample_config:
          num_courses: 10
        threshold: -5.0 # Mean reward threshold for advancement
        advancement_patience: 3 # Consecutive checkpoints above threshold

      - name: "medium"
        enabled: true
        num_episodes: 300
        max_generations: 200
        checkpoint_every: 25
        validation_episodes: 5
        sample_config:
          num_courses: 20
        threshold: -3.0
        advancement_patience: 3

      - name: "hard"
        enabled: true
        num_episodes: 500
        max_generations: 400
        checkpoint_every: 50
        validation_episodes: 10
        sample_config:
          num_courses: 40
        threshold: -2.0
        advancement_patience: 3

    # Checkpoint settings
    checkpoint_settings:
      manifest_path: "models/rl_agents/manifest.json"
      validation_set_dir: "data/validation"
      checkpoint_keep_last: 5 # Keep only last N checkpoints per stage
      validation_threshold: 0.05 # Relative improvement for stage advancement
      adaptive_advance_patience: 3 # Checkpoints above threshold for advancement

  # Inference configuration
  inference:
    batch_prediction: false # Batch multiple predictions
    timeout_ms: 10 # Max inference time (milliseconds)
    fallback_on_timeout: true
    cache_predictions: false

  # Hybrid controller
  hybrid:
    mode: rl_primary # Options: rl_primary, rl_fallback, rl_assisted
    fallback_strategy: random # Fallback when RL fails (random, greedy, round_robin)
    rl_probability: 0.8 # Probability of using RL vs fallback (rl_assisted mode)
    enable_action_masking: true # Mask invalid actions

  # Evaluation and metrics
  evaluation:
    baseline_strategies:
      - random
      - round_robin
      - greedy
      - fixed_priority
    num_evaluation_episodes: 10
    save_metrics: true
    metrics_dir: output/rl_metrics

  # Logging
  logging:
    log_heuristic_usage: true
    log_rewards: true
    log_state_transitions: false # Verbose (disabled by default)
    log_inference_time: true
