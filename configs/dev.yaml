name: "Development Configuration"
environment: dev

ga:
  ngen: 200
  pop_size: 100
  cxpb: 0.85
  mutpb: 0.25

parallel:
  use_multiprocessing: true
  num_workers: null

repair:
  max_iterations: 7
  memetic_mode: true
  elite_percentage: 0.25
  memetic_iterations: 3

feasibility:
  fail_on_infeasibility: false

enhancements:
  memetic_mode: true
  increased_population: true
  greedy_initialization_percent: 0.5
  hypermutation:
    enabled: true
  violation_heatmap:
    top_n_hotspots: 30
  multi_neighborhood:
    max_combinations: 100
