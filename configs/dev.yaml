# Medium-scale development configuration for iterative testing.
# Only overrides what differs from common.yaml (ngen, pop_size, parallel).

name: "Development Configuration - IGLS System"
environment: dev
description: "Medium-scale dev config with IGLS repair (200 gens)"

# Environment-specific GA settings
ga:
  ngen: 200  # Medium run for development
  pop_size: 50  # Moderate population

# Environment-specific parallel settings
parallel:
  use_multiprocessing: true  # Enable for dev runs
  num_workers: null  # Auto-detect


