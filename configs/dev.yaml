# ============================================================================
# DEVELOPMENT CONFIGURATION - Standard Run (10-15 minutes)
# ============================================================================
# Purpose: Development and debugging with reasonable quality
# Use: python main.py --env dev  (or just: python main.py)

name: "Development Configuration"
environment: dev

# Genetic Algorithm Settings
ga:
  ngen: 100              # Medium generations
  pop_size: 20           # Small-medium population
  cxpb: 0.8
  mutpb: 0.3
  elite_preservation: true
  elite_size: 0.05
  use_adaptive_probabilities: true
  use_constraint_guided_mutation: true
  population_strategy: hybrid
  validate_population_integrity: false

# Parallelization (enabled)
parallel:
  use_multiprocessing: true
  num_workers: 4        # Adjust based on your CPU

# Repair Heuristics
repair:
  enabled: true
  max_iterations: 3
  apply_after_mutation: true
  apply_after_crossover: true
  memetic_mode: false
  elite_percentage: 0.1
  memetic_iterations: 5
  selective_mode: true
  detection_strategy: hybrid
  recheck_after_repair: true

# Feasibility Checks (strict)
feasibility:
  enable_checks: true
  fail_on_infeasibility: true  # Stop if problem is infeasible
  tolerance_margin: 0.02       # 2% tolerance
  generate_report: true
  show_console_output: true
  save_report_on_success: true

# Time Configuration
time:
  quantum_minutes: 60
  earliest_preferred_time: "10:00"
  latest_preferred_time: "17:00"
  midday_break_start: "12:00"
  midday_break_end: "14:00"
  max_session_coalescence: 3

# I/O Paths
io:
  data_dir: data
  output_dir: output

# Hard Constraints
hard_constraints:
  no_group_overlap:
    enabled: true
    weight: 2.0
  no_instructor_conflict:
    enabled: true
    weight: 2.0
  instructor_not_qualified:
    enabled: true
    weight: 2.0
  room_type_mismatch:
    enabled: true
    weight: 2.0
  availability_violations:
    enabled: true
    weight: 2.0
  incomplete_or_extra_sessions:
    enabled: true
    weight: 1.0

# Soft Constraints
soft_constraints:
  group_gaps_penalty:
    enabled: true
    weight: 1.0
  instructor_gaps_penalty:
    enabled: true
    weight: 1.0
  group_midday_break_violation:
    enabled: true
    weight: 1.0
  session_block_clustering_penalty:
    enabled: true
    weight: 1.0
  soft_weight_factor: 0.01
