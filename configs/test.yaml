# Fast smoke test configuration - minimal generations for quick validation.
# Only overrides what differs from common.yaml (ngen, pop_size, parallel).

name: "Test Configuration - IGLS System"
environment: test
description: "Fast smoke test with IGLS repair (30 gens to test both exhaustive triggers)"

# Environment-specific GA settings
ga:
  ngen: 30  # Extended to test gen 3 and gen 25 triggers
  pop_size: 10  # Small for fast testing

# Environment-specific parallel settings
parallel:
  use_multiprocessing: false  # Disabled for easier debugging
  num_workers: null


