# ============================================================================
# TEST CONFIGURATION - Quick Smoke Test (2-5 minutes)
# ============================================================================
# Purpose: Verify code works without waiting for full run
# Use: python main.py --env test

name: "Quick Test Configuration"
environment: test

# Genetic Algorithm Settings
ga:
  ngen: 10              # Only 10 generations (fast!)
  pop_size: 4           # Small population (must be even)
  cxpb: 0.8             # Crossover probability
  mutpb: 0.3            # Mutation probability
  elite_preservation: true
  elite_size: 0.05
  use_adaptive_probabilities: true
  use_constraint_guided_mutation: true
  population_strategy: hybrid  # hybrid, smart, or random
  validate_population_integrity: false

# Parallelization (disabled for debugging)
parallel:
  use_multiprocessing: false  # Single-threaded for easier debugging
  num_workers: null

# Repair Heuristics (reduced iterations)
repair:
  enabled: true
  max_iterations: 2     # Reduced for speed
  apply_after_mutation: true
  apply_after_crossover: true
  memetic_mode: false
  elite_percentage: 0.1
  memetic_iterations: 5
  selective_mode: true
  detection_strategy: hybrid
  recheck_after_repair: true

# Feasibility Checks (lenient for testing)
feasibility:
  enable_checks: true
  fail_on_infeasibility: false  # Continue even if infeasible (for testing)
  tolerance_margin: 0.05        # More tolerant (5%)
  generate_report: true
  show_console_output: true
  save_report_on_success: true

# Time Configuration
time:
  quantum_minutes: 60
  earliest_preferred_time: "10:00"
  latest_preferred_time: "17:00"
  midday_break_start: "12:00"
  midday_break_end: "14:00"
  max_session_coalescence: 3

# I/O Paths
io:
  data_dir: data
  output_dir: output

# Hard Constraints
hard_constraints:
  no_group_overlap:
    enabled: true
    weight: 2.0
  no_instructor_conflict:
    enabled: true
    weight: 2.0
  instructor_not_qualified:
    enabled: true
    weight: 2.0
  room_type_mismatch:
    enabled: true
    weight: 2.0
  availability_violations:
    enabled: true
    weight: 2.0
  incomplete_or_extra_sessions:
    enabled: true
    weight: 1.0

# Soft Constraints
soft_constraints:
  group_gaps_penalty:
    enabled: true
    weight: 1.0
  instructor_gaps_penalty:
    enabled: true
    weight: 1.0
  group_midday_break_violation:
    enabled: true
    weight: 1.0
  session_block_clustering_penalty:
    enabled: true
    weight: 1.0
  soft_weight_factor: 0.01

# ============================================================================
# ENHANCEMENTS - Master switch (minimal for quick testing)
# ============================================================================
enhancements:
  master_enabled: true  # Keep enabled for smoke testing
  
  # Phase 1: Immediate wins (minimal settings for speed)
  memetic_mode: false             # Disabled for test (too slow)
  increased_population: false     # Keep small pop for speed
  frequent_repair: false          # Standard repair intervals
  
  # Phase 2: High priority (disabled for quick testing)
  hypermutation:
    enabled: false
    trigger_on_stagnation: true
    stagnation_window: 3
    duration_generations: 1
    mutation_rate: 0.7
  
  constraint_priorities:
    enabled: true                 # Keep this - it's fast
    availability_weight: 0.8
    overlap_weight: 0.15
    other_weight: 0.05
  
  greedy_initialization_percent: 0.25  # Keep original 25% for test
  
  # Phase 3: Advanced Features (Test with caution)
  population_restart:
    enabled: false               # [RISKY] Disabled in test (causes disruption)
    trigger_stagnation_gens: 15  # Restart after 15 gens of stagnation
    restart_percentage: 0.5      # Replace 50% of population
    min_interval_gens: 50        # Minimum 50 gens between restarts
  
  violation_heatmap:
    enabled: true                # [SAFE] Track hot genes for analysis
    target_hot_genes: true       # Use heatmap for targeted repair
    top_n_hotspots: 20           # Show top 20 hotspots in summary
    persistence_file: "violation_heatmap.json"
  
  multi_neighborhood:
    enabled: true                # [SAFE] Enhanced repair strategy
    max_combinations: 50         # Try up to 50 combined moves per gene
    fallback_to_single: true     # Fallback to single-neighborhood if combined fails
