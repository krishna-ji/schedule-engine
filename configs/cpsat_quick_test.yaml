# Ultra-minimal CP-SAT test configuration
# Use this to verify CP-SAT works quickly

name: "cpsat_quick_test"
environment: "test"

# OR-Tools CP-SAT Configuration
ortools:
  enabled: true
  time_limit: 30  # 30 seconds max
  num_solutions: 1  # Just find ONE solution
  random_seed: 42
  parallel_threads: 4  # Use multiple cores

# Disable GA entirely for pure CP-SAT test
ga:
  ngen: 1
  pop_size: 2
  cxpb: 0.8
  mutpb: 0.3

parallel:
  use_multiprocessing: false

repair:
  enabled: false

# Hard Constraints (minimal set)
hard_constraints:
  no_group_overlap:
    enabled: true
    weight: 1.0
  no_instructor_conflict:
    enabled: false  # DISABLE to speed up
    weight: 0.0
  instructor_not_qualified:
    enabled: true
    weight: 1.0
  room_type_mismatch:
    enabled: true
    weight: 1.0
  availability_violations:
    enabled: true
    weight: 1.0
  incomplete_or_extra_sessions:
    enabled: false
    weight: 0.0
  session_block_clustering_penalty:
    enabled: false
    weight: 0.0

# Soft Constraints (disabled for speed test)
soft_constraints:
  group_gap_penalty:
    enabled: false
    weight: 0.0
  instructor_gap_penalty:
    enabled: false
    weight: 0.0
  time_preference_violation:
    enabled: false
    weight: 0.0
  consecutive_days_penalty:
    enabled: false
    weight: 0.0
  instructor_overload_penalty:
    enabled: false
    weight: 0.0

feasibility:
  enable_checks: false
  fail_on_infeasible: false

time:
  quantum_minutes: 60
  earliest_preferred_time: "08:00"
  latest_preferred_time: "17:00"
  midday_break_start: "12:00"
  midday_break_end: "13:00"
  preferred_block_size_min: 2
  preferred_block_size_max: 3
  max_session_coalescence: 4
  max_sessions_per_day: 6
  theory_max_excused_isolated: 1
  theory_isolated_penalty: 2
  theory_oversized_penalty_per_quantum: 1
  practical_fragmentation_penalty: 20

io:
  data_dir: "data"
  output_dir: "output"
  log_level: "INFO"

calendar:
  show_room_info: true
  show_group_info: true
  compact_mode: false

colors:
  use_custom_colors: true
  scheme: "vibrant"
