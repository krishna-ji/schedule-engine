# ============================================================================
# PROD CONFIGURATION - Best Possible Settings (No Constraints)/ but notprod
# ============================================================================
# Maximum quality production run - use best hardware available.
# Expected runtime: 24-48 hours on 16+ cores, 32+ GB RAM.
# This config inherits all settings from base.yaml.

name: "Production - Best Quality (No Constraints)"
environment: notprod
description: "Maximum quality production run (1000 gens, 100 pop, 24-48h runtime)"

# GA Settings - PROD: Maximum generations and population
ga:
  ngen: 800
  pop_size: 100

# Parallel Processing - Maximum parallelization
parallel:
  use_multiprocessing: true
  num_workers: null # Auto-detect all available cores

# LNS-CP Hybrid - ENABLED for Production
lns:
  enabled: true
  trigger_interval: 100 # Every 100 generations
  stagnation_threshold: 20 # After 20 gens of stagnation
  max_subproblem_size: 25 # Larger subproblems for prod
  cp_time_limit: 15.0 # 15 seconds time limit
  apply_to_best_n: 2 # Repair top 2 individuals

# IGLS Exhaustive Search - Production triggers
repair:
  exhaustive_search:
    enabled: true
    generations: [3, 30, 100, 200, 350, 500, 800, 1200, 1600, 1900]
    population_coverage: 0.15 # Top 15% (30 individuals)
    max_neighborhood_size: 120
    timeout_seconds: 1000

  stagnation_repair:
    patience: 15
    min_generation: 20
    population_coverage: 0.2 # Top 20% (40 individuals)
    max_iterations: 15
    timeout_seconds: 180
    cooldown: 8

  selective_repair:
    apply_probability: 0.3
    apply_after_crossover: false # Disabled for maximum exploration
