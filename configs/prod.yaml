# ================
# PROD CONFIGURATION - Best Possible Settings (No Constraints)
# ================
# Maximum quality production run - use best hardware available.
# Expected runtime: 24-48 hours on 16+ cores, 32+ GB RAM.
# This config inherits all settings from base.yaml.

name: "Production - Best Quality (No Constraints)"
environment: prod
description: "Maximum quality production run (2000 gens, 200 pop, 24-48h runtime)"

# GA Settings - PROD: Maximum generations and population
ga:
  ngen: 2000
  pop_size: 1000 # Larger population for better solution quality

# Parallel Processing - Inherited from base.yaml (CPU cores * 2)

# LNS-IGLS Repair - ENABLED for Production
lns:
  # enabled: true  <-- Controlled by Runtime Mode
  trigger_interval: 100 # Every 100 generations
  stagnation_threshold: 10 # After 10 gens of stagnation (aggressive)
  force_trigger_generations: [6] # Early validation trigger (confirms LNS works before long run)
  trigger_before_igls: false # LNS after IGLS
  max_subproblem_size: 30 # Larger subproblems for prod
  min_subproblem_size: 6 # Min size for meaningful repair
  expand_neighborhood_hops: 1 # Expand conflict graph 1 hop for connected subproblems
  igls_max_iterations: 1000 # 1000 iterations for IGLS repair
  igls_time_limit: 1000.0 # 1000 seconds (effectively unlimited)
  apply_to_best_n: 3 # Repair top 3 individuals
  enable_diagnostics: true # Log detailed subproblem info

# IGLS Exhaustive Search - Production triggers (NO overlap with LNS intervals)
repair:
  exhaustive_search:
    # enabled: true  <-- Controlled by Runtime Mode
    generations: [3, 30, 150, 250, 350, 450, 550, 650, 750, 850, 950]
    population_coverage: 0.15 # Top 15% (15 individuals)
    max_neighborhood_size: 120
    timeout_seconds: 1000

  stagnation_repair:
    patience: 15
    min_generation: 20
    population_coverage: 0.2 # Top 20% (40 individuals)
    max_iterations: 15
    timeout_seconds: 180
    cooldown: 8

  selective_repair:
    apply_probability: 0.3
    apply_after_crossover: false # Disabled for maximum exploration
