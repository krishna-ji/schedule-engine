# ============================================================================
# PROD CONFIGURATION - High-Quality Production
# ============================================================================
# Full-scale production configuration for final quality runs.
# Requires good hardware: 8+ cores, 16+ GB RAM.
# Expected runtime: 12-24 hours.

name: "Production Configuration - IGLS System (Full Scale)"
environment: prod
description: "Full-scale production with strategic IGLS triggers (500 gens, ~24h runtime)"

# Environment-specific GA settings
ga:
  ngen: 500  # Long run for production quality
  pop_size: 100  # Large population

# Environment-specific parallel settings
parallel:
  use_multiprocessing: true  # Enable for production
  num_workers: null  # Auto-detect

# Production-optimized IGLS settings
repair:
  enabled: true
  
  # Legacy parameters
  apply_after_mutation: false
  apply_after_crossover: false
  selective_mode: true
  detection_strategy: hybrid
  recheck_after_repair: false
  max_iterations: 2
  memetic_mode: false
  
  # TIER 1: Exhaustive Search - Strategic triggers throughout evolution
  exhaustive_search:
    enabled: true
    generations: [3, 30, 100, 200, 350, 480]  # 6 triggers: early, mid, late phases
    population_coverage: 0.15  # Top 15% (15 individuals) - manageable with timeout
    max_neighborhood_size: 120  # More thorough search
    timeout_seconds: 600  # 10 minutes per trigger
  
  # TIER 2: Stagnation-Triggered Greedy - Conservative for long runs
  stagnation_repair:
    enabled: true
    patience: 15  # Allow more generations (long run = natural fluctuations)
    min_generation: 20  # Start later to avoid early noise
    population_coverage: 0.2  # Top 20% (20 individuals)
    max_iterations: 15  # More iterations for quality
    timeout_seconds: 180  # 3 minutes
    cooldown: 8  # Longer cooldown to avoid over-repair
  
  # TIER 3: Selective Probabilistic - Standard settings
  selective_repair:
    enabled: true
    apply_probability: 0.3
    apply_after_mutation: true
    apply_after_crossover: false
    detection_strategy: hybrid


