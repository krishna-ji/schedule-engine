# Production-quality profile for long curriculum runs (1h+)
profile: prod
timesteps: 300000
max_generations: 200
max_steps: 80
population_size: 80
eval_episodes: 10
save_prefix: rl_agent_prod

# Parallel training - AUTO-DETECT MAXIMUM CPU CORES
parallel:
  n_envs: null # null = auto-detect all CPU cores (e.g., 16 cores → 16 envs)
  use_subproc: true # True parallelism (no GIL)

# Device
device: cpu # CPU-only execution

# Debug logging (verbose environment progress)
debug_logging: true
debug_log_interval: 25 # Log every 25 steps
