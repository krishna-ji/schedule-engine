# ============================================================================
# PROD NO LOCAL SEARCH CONFIG - CP-SAT with IGLS Disabled
# ============================================================================
# Pure GA + CP-SAT LNS (no IGLS local search).
# Tests if CP-SAT can replace local search entirely.
# Expected runtime: 20-30 hours on 16+ cores, 32+ GB RAM.
# This config inherits all settings from base.yaml.

name: "Production - No Local Search (GA + CP-SAT only)"
environment: prod
description: "Pure GA evolution with CP-SAT LNS, no IGLS local search (1000 gens, 100 pop)"

# GA Settings - PROD: Balanced population
ga:
  ngen: 1000
  pop_size: 100

# Parallel Processing - Maximum parallelization
parallel:
  use_multiprocessing: true
  num_workers: null # Auto-detect all available cores

# LNS CP-SAT - PURE CP STRATEGY
lns:
  enabled: true
  repair_strategy: cp # Pure CP-SAT only
  trigger_interval: 50 # More frequent (every 50 gens since no IGLS)
  stagnation_threshold: 15 # Earlier trigger (15 gens stagnation)
  force_trigger_generations: [6, 50] # Early validation + mid-run check
  trigger_before_igls: false # N/A (IGLS disabled)
  max_subproblem_size: 30 # Larger subproblems (no IGLS to clean up first)
  min_subproblem_size: 5 # Min size
  expand_neighborhood_hops: 2 # 2-hop expansion for connected subproblems
  cp_time_limit: 25.0 # 25 seconds for CP-SAT
  heuristic_max_iterations: 0 # Disabled (acceptable when repair_strategy is 'cp')
  heuristic_time_limit: 0.0 # Disabled (acceptable when repair_strategy is 'cp')
  apply_to_best_n: 5 # Repair top 5 individuals (more aggressive without IGLS)
  enable_diagnostics: true # FULL diagnostics
  pre_check_feasibility: true # Pre-check enabled

# IGLS - COMPLETELY DISABLED (testing pure GA + CP-SAT)
repair:
  exhaustive_search:
    enabled: false # DISABLED

  stagnation_repair:
    enabled: false # DISABLED

  selective_repair:
    enabled: false # DISABLED
