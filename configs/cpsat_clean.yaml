# Pure CP-SAT Configuration
# Clean configuration for hard constraint satisfaction only
# No GA, no soft constraints, no overhead

# Solver settings
solver:
  time_limit: 0 # seconds (0 = unlimited)
  workers: 4 # parallel search workers (memory-safe)
  random_seed: 42 # for reproducibility

# Time configuration
time:
  quantum_minutes: 60
  start_time: "08:00"
  end_time: "18:00"

# Input/Output
io:
  data_dir: "data"
  output_dir: "output"

# Logging
logging:
  level: "INFO" # DEBUG, INFO, WARNING, ERROR
  console: true
  file: true
