name: "Repair Trigger Test Configuration"
environment: test  # Must be test, dev, or prod

# Time settings (required)
time:
  quantum_minutes: 60
  earliest_preferred_time: "10:00"
  latest_preferred_time: "17:00"
  midday_break_start: "12:00"
  midday_break_end: "14:00"
  max_session_coalescence: 3
  max_sessions_per_day: 5
  preferred_block_size_min: 2
  preferred_block_size_max: 3
  theory_isolated_penalty: 2
  theory_oversized_penalty_per_quantum: 1
  theory_max_excused_isolated: 1
  practical_fragmentation_penalty: 2

# I/O paths (required)
io:
  data_dir: data
  output_dir: output

ga:
  ngen: 25  # Need at least 20 to see intensive trigger
  pop_size: 10  # Small but even
  cxpb: 0.8
  mutpb: 0.3

parallel:
  use_multiprocessing: false
  num_workers: null

repair:
  enabled: true
  max_iterations: 2
  memetic_mode: false  # Will be enabled by triggers
  elite_percentage: 0.2
  memetic_iterations: 3
  apply_after_mutation: true
  apply_after_crossover: true
  selective_mode: true
  
  # Test adaptive repair with shorter intervals
  adaptive_repair:
    stagnation_trigger:
      enabled: true
      window: 3  # Detect stagnation quickly
      threshold: 0.0
    
    periodic_trigger:
      enabled: true
      interval: 5  # Soft repair every 5 gens (easier to see)
      intensive_interval: 10  # Hard repair every 10 gens
    
    trigger_action:
      repair_mode: selective
      max_iterations: 3
    
    intensive_action:
      repair_mode: full
      max_iterations: 20  # Lower for test (not infinite)

feasibility:
  fail_on_infeasibility: false
  tolerance_margin: 0.05

enhancements:
  memetic_mode: false
  increased_population: false
  greedy_initialization_percent: 0.25
  hypermutation:
    enabled: false
  violation_heatmap:
    enabled: true
    top_n_hotspots: 10
  multi_neighborhood:
    max_combinations: 20

