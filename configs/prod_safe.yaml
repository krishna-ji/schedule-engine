# ============================================================================
# PROD_SAFE CONFIGURATION - VM-Optimized Production
# ============================================================================
# Safe production configuration optimized for typical VM resources.
# Balances quality and runtime for 4-8 core VMs with 8-16GB RAM.
# This inherits all settings from common.yaml.

name: "Production Safe - IGLS System (VM-Optimized)"
environment: prod
description: "VM-friendly production config with strategic IGLS triggers (250 gens, 4-6 hour runtime)"

# Environment-specific GA settings
ga:
  ngen: 250  # Balanced: long enough for quality, short enough to complete
  pop_size: 50  # Moderate population for VM

# Environment-specific parallel settings
parallel:
  use_multiprocessing: true
  num_workers: null  # Auto-detect (or set explicitly: 4, 6, 8)
