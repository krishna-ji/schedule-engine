name: "Development Rebalanced Configuration"
environment: dev

# Targeted overrides for rebalanced constraint priorities and stability

ga:
  ngen: 150
  pop_size: 100
  cxpb: 0.85
  mutpb: 0.15

repair:
  max_iterations: 15
  memetic_mode: true
  elite_percentage: 0.25
  memetic_iterations: 3

hard_constraints:
  no_group_overlap:
    weight: 2.5
  no_instructor_conflict:
    weight: 2.5
  availability_violations:
    weight: 2.5
  session_block_clustering_penalty:
    weight: 1.0

enhancements:
  memetic_mode: true
  increased_population: true
  greedy_initialization_percent: 0.5
  hypermutation:
    enabled: true
  violation_heatmap:
    top_n_hotspots: 30
  multi_neighborhood:
    max_combinations: 100
  population_restart:
    enabled: true
    trigger_stagnation_gens: 10
    restart_percentage: 0.3
    min_interval_gens: 50
