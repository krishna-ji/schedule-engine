# ============================================================================
# CP-SAT SCHEDULE ENGINE - PURE CONSTRAINT PROGRAMMING
# ============================================================================
# Single configuration file for Google OR-Tools CP-SAT solver
# No genetic algorithms, no soft constraints, no overhead

# Solver Configuration
solver:
  # Time limit in seconds (0 = unlimited, runs until solution found)
  time_limit: 0

  # Parallel search workers (memory-safe limit)
  # Recommended: 4-8 workers for 16GB RAM, 2-4 for 8GB RAM
  num_workers: 4

  # Random seed for reproducibility (null = random)
  random_seed: null

  # Presolve configuration
  presolve:
    enabled: true
    symmetry_level: 0 # Disable symmetry breaking (memory expensive)
    linearization_level: 0 # Disable linearization (creates auxiliary constraints)
    optimize_with_core: false # Disable for large problems
    max_iterations: 3 # Limit presolve passes

  # Logging
  log_search_progress: true # Show CP-SAT solver progress

# Time System Configuration
time:
  quantum_minutes: 60 # 60-minute discrete time units
  earliest_time: "08:00" # Day starts at 8 AM
  latest_time: "18:00" # Day ends at 6 PM
  # Total: 10 hours/day × 7 days = 70 time quanta per week

# Data Paths
io:
  data_dir: data # Input JSON files directory
  output_dir: output # Solution output directory

# Hard Constraints (CP-SAT enforces these declaratively)
# All constraints are ALWAYS enabled - this section is for documentation only
constraints:
  no_group_overlap: true # Students can't be in two places at once
  no_instructor_conflict: true # Instructor teaches one session at a time
  no_room_conflict: true # Room hosts one session at a time
  availability_respected: true # Groups, instructors, rooms availability
  room_type_matching: true # Lab courses → lab rooms, theory → theory rooms
  qualification_requirements: true # Instructors qualified for their courses

# Logging Configuration
logging:
  level: INFO # INFO, WARNING, ERROR
  format: "%(asctime)s | %(levelname)-8s | %(message)s"
  date_format: "%Y-%m-%d %H:%M:%S"
# Notes
# ------
# - This is a PURE CP-SAT implementation (no genetic algorithms)
# - Solver finds ANY schedule satisfying all hard constraints
# - No soft constraints or preference optimization
# - Expected runtime: Hours to days depending on problem complexity
# - Memory usage: ~4-6 GB with 4 workers
