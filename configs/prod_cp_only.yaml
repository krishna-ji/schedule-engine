# ============================================================================
# PROD CP-SAT ONLY CONFIG - Pure CP-SAT Strategy (No Heuristic Local Search)
# ============================================================================
# Tests CP-SAT effectiveness without heuristic fallback.
# Expected runtime: 24-48 hours on 16+ cores, 32+ GB RAM.
# This config inherits all settings from base.yaml.

name: "Production - CP-SAT Only (Pure Constraint Programming)"
environment: prod
description: "CP-SAT only strategy with multiprocessing (1000 gens, 100 pop)"

# GA Settings - PROD: Balanced population
ga:
  ngen: 1000
  pop_size: 100

# Parallel Processing - Maximum parallelization for GA
parallel:
  use_multiprocessing: true
  num_workers: null # Auto-detect all available cores

# LNS CP-SAT - PURE CP STRATEGY (no heuristic fallback)
lns:
  enabled: true
  repair_strategy: cp # Pure CP-SAT only (no heuristic)
  trigger_interval: 100 # Every 100 generations
  stagnation_threshold: 20 # After 20 gens of stagnation
  force_trigger_generations: [6] # Early validation trigger (confirms CP works)
  trigger_before_igls: false # LNS after IGLS
  max_subproblem_size: 25 # Moderate subproblem size for CP-SAT
  min_subproblem_size: 5 # Min size for meaningful CP solve
  expand_neighborhood_hops: 2 # Expand conflict graph 2 hops for larger connected subproblems
  cp_time_limit: 30.0 # 30 seconds for CP-SAT (longer for pure CP strategy)
  heuristic_max_iterations: 0 # Disabled (not used in cp strategy)
  heuristic_time_limit: 0.0 # Disabled (not used in cp strategy)
  apply_to_best_n: 3 # Repair top 3 individuals
  enable_diagnostics: true # FULL diagnostics logging
  pre_check_feasibility: true # Pre-check before invoking CP-SAT

# IGLS Exhaustive Search - Production triggers
repair:
  exhaustive_search:
    enabled: true
    generations: [3, 30, 100, 200, 350, 500, 800]
    population_coverage: 0.15 # Top 15%
    max_neighborhood_size: 120
    timeout_seconds: 1000

  stagnation_repair:
    patience: 15
    min_generation: 20
    population_coverage: 0.2 # Top 20%
    max_iterations: 15
    timeout_seconds: 180
    cooldown: 8

  selective_repair:
    apply_probability: 0.3
    apply_after_crossover: false # Disabled for maximum exploration
