# ================
# RUNTIME MODE 5: Full GA (Everything Enabled)
# ================
# NSGA-II + repairs + heuristics + memetic + LNS local search.
# This is the "best GA" configuration without RL.
# Tests: Does combining all techniques achieve best results?

ga:
  ngen: 2000
  pop_size: 200
  cxpb: 0.75
  mutpb: 0.25
  elite_preservation: true
  elite_size: 0.1
  use_adaptive_probabilities: true # Adaptive probabilities enabled
  use_constraint_guided_mutation: true
  population_strategy: random # FIXED: Smart init produces worse solutions with many constraints
  validate_population_integrity: false

# Enable IGLS repair system with memetic mode
repair:
  enabled: true
  apply_after_mutation: false
  apply_after_crossover: false
  selective_mode: true
  detection_strategy: hybrid
  recheck_after_repair: false
  max_iterations: 2
  memetic_mode: true # Memetic local search enabled
  elite_percentage: 0.05
  memetic_iterations: 1

  adaptive_repair:
    stagnation_trigger:
      enabled: false
    periodic_trigger:
      enabled: false

  stagnation_repair:
    enabled: true
    patience: 8
    min_generation: 12
    population_coverage: 0.4
    max_iterations: 15
    timeout_seconds: 120
    cooldown: 5

  selective_repair:
    enabled: true
    apply_probability: 0.4
    apply_after_mutation: true
    apply_after_crossover: true
    detection_strategy: hybrid

# Enable LNS-IGLS local search
lns:
  enabled: true
  trigger_interval: 50
  stagnation_threshold: 10
  force_trigger_generations: []
  trigger_before_igls: false
  max_subproblem_size: 20
  min_subproblem_size: 4
  expand_neighborhood_hops: 0
  igls_max_iterations: 500
  igls_time_limit: 5.0
  apply_to_best_n: 1
  enable_diagnostics: true

# Enable enhancements
enhancements:
  master_enabled: true
  memetic_mode: true
  increased_population: false
  frequent_repair: false
  hypermutation:
    enabled: true
    trigger_on_stagnation: true
    stagnation_window: 10
    duration_generations: 1
    mutation_rate: 0.5
  constraint_priorities:
    enabled: true
    availability_weight: 0.8
    overlap_weight: 0.15
    other_weight: 0.05
  greedy_initialization_percent: 0.0 # DISABLED: Construction heuristics create different gene structure (split vs combined groups)
  population_restart:
    enabled: true
    trigger_stagnation_gens: 50
    restart_percentage: 0.3
    min_interval_gens: 100
  violation_heatmap:
    enabled: true
    target_hot_genes: true
    top_n_hotspots: 5
    persistence_file: "violation_heatmap.json"
  multi_neighborhood:
    enabled: true
    max_combinations: 10
    fallback_to_single: true

# Enable all Phase 1.5 heuristics
heuristics:
  construction:
    largest_degree_first:
      enabled: true
      priority: 1
    most_constrained_first:
      enabled: true
      priority: 2
    earliest_deadline_first:
      enabled: true
      priority: 3

  perturbation:
    random_swap:
      enabled: true
      priority: 1
      swap_type: time
      num_swaps: 1
    temporal_shift:
      enabled: true
      priority: 2
      delta: null
      probability: 0.3
    room_shuffle:
      enabled: true
      priority: 3
      probability: 0.2
    instructor_reassign:
      enabled: true
      priority: 4
      probability: 0.15
      prefer_available: true
    multi_perturbation:
      enabled: true
      priority: 5

  improvement:
    kempe_chain:
      enabled: true
      priority: 1
      max_iterations: 5
    ejection_chain:
      enabled: true
      priority: 2
      max_chain_length: 5
      max_iterations: 3
    variable_depth_search:
      enabled: true
      priority: 3
      max_depth: 3
      max_iterations: 5

  diversity:
    distance_preserving_crossover:
      enabled: true
      priority: 1
      preserve_distance: 0.7
    crowding_mutation:
      enabled: true
      priority: 2
      intensity: 0.3
    niching_selection:
      enabled: true
      priority: 3
      niche_radius: 0.3
      select_count: 10
    adaptive_diversity_maintenance:
      enabled: true
      priority: 4
      diversity_threshold: 0.2

  meta:
    variable_neighborhood_descent:
      enabled: true
      priority: 1
      max_neighborhoods: 3
      max_iterations: 5
    iterated_local_search:
      enabled: true
      priority: 2
      num_iterations: 5
      perturbation_strength: 0.3
    adaptive_large_neighborhood:
      enabled: true
      priority: 3
      num_iterations: 10
      initial_destroy_rate: 0.3
    guided_local_search:
      enabled: true
      priority: 4
      num_iterations: 10
      penalty_factor: 0.1

# Disable RL
rl:
  enabled: false
  mode: disabled
