# ================
# NSGA-II + HEURISTICS CONFIGURATION
# ================
# NSGA-II with repair system + 19 domain heuristics (no LNS-IGLS)
# Tests effectiveness of heuristic operators without heavy local search

name: "NSGA-II + Repairs + Heuristics"
environment: prod
description: "NSGA-II with IGLS repairs + Phase 1.5 heuristic toolbox (19 operators)"

# GA Settings - Production scale
ga:
  ngen: 2000
  pop_size: 1000

# IGLS Repair System - Strategic repairs only (no after-generation repairs)
repair:
  enabled: true
  apply_after_mutation: false   # No repair after every mutation
  apply_after_crossover: false  # No repair after every crossover
  selective_mode: true
  max_iterations: 3
  memetic_mode: false  # No memetic local search

  stagnation_repair:
    enabled: true
    patience: 12
    min_generation: 20
    population_coverage: 0.3
    max_iterations: 10
    timeout_seconds: 180
    cooldown: 8

  selective_repair:
    enabled: false  # Disable selective repair for cleaner heuristic testing
    apply_after_mutation: false
    apply_after_crossover: false

  exhaustive_search:
    enabled: true
    generations: [5, 100, 300, 600, 1000, 1500]  # Periodic IGLS
    population_coverage: 0.1
    max_neighborhood_size: 80
    timeout_seconds: 300

# LNS-IGLS - DISABLED (keep separate from heuristics)
lns:
  enabled: false

# ALL HEURISTICS ENABLED
heuristics:
  construction:
    largest_degree_first:
      enabled: true
    most_constrained_first:
      enabled: true
    earliest_deadline_first:
      enabled: true
      
  perturbation:
    random_swap:
      enabled: true
    temporal_shift:
      enabled: true
    room_shuffle:
      enabled: true
    instructor_reassign:
      enabled: true
    multi_perturbation:
      enabled: true
      
  improvement:
    kempe_chain:
      enabled: true
    ejection_chain:
      enabled: true
    variable_depth_search:
      enabled: true
      
  diversity:
    distance_preserving_crossover:
      enabled: true
    crowding_mutation:
      enabled: true
    niching_selection:
      enabled: true
    adaptive_diversity_maintenance:
      enabled: true
      
  meta:
    variable_neighborhood_descent:
      enabled: true
    iterated_local_search:
      enabled: true
    adaptive_large_neighborhood:
      enabled: true
    guided_local_search:
      enabled: true

# Enhancements - Disabled for clean testing
enhancements:
  master_enabled: false
  
# RL Integration - Disabled
rl:
  enabled: false