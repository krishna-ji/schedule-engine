# ============================================================================
# RUNTIME MODE 5: NSGA-II + RL-Guided Repairs + Local Search
# ============================================================================
# Full GA with RL agent controlling heuristic selection.
# RL guides both repair strategies and local search budget.

ga:
  ngen: 2000
  pop_size: 200
  cxpb: 0.75
  mutpb: 0.25
  elite_preservation: true
  elite_size: 0.1
  use_adaptive_probabilities: true # RL may override this dynamically
  use_constraint_guided_mutation: true
  population_strategy: hybrid
  validate_population_integrity: false

# Enable IGLS repair system with memetic mode
repair:
  enabled: true
  apply_after_mutation: false
  apply_after_crossover: false
  selective_mode: true
  detection_strategy: hybrid
  recheck_after_repair: false
  max_iterations: 2
  memetic_mode: true
  elite_percentage: 0.05
  memetic_iterations: 1

  adaptive_repair:
    stagnation_trigger:
      enabled: false
    periodic_trigger:
      enabled: false

  stagnation_repair:
    enabled: true
    patience: 8
    min_generation: 12
    population_coverage: 0.4
    max_iterations: 15
    timeout_seconds: 120
    cooldown: 5

  selective_repair:
    enabled: true
    apply_probability: 0.4
    apply_after_mutation: true
    apply_after_crossover: true
    detection_strategy: hybrid

# Enable LNS-IGLS local search
lns:
  enabled: true
  trigger_interval: 50
  stagnation_threshold: 10
  force_trigger_generations: []
  trigger_before_igls: false
  max_subproblem_size: 20
  min_subproblem_size: 4
  expand_neighborhood_hops: 0
  igls_max_iterations: 500
  igls_time_limit: 5.0
  apply_to_best_n: 1
  enable_diagnostics: true

# Enable enhancements
enhancements:
  master_enabled: true
  memetic_mode: true
  increased_population: false
  frequent_repair: false
  hypermutation:
    enabled: true
    trigger_on_stagnation: true
    stagnation_window: 10
    duration_generations: 1
    mutation_rate: 0.5
  constraint_priorities:
    enabled: true
    availability_weight: 0.8
    overlap_weight: 0.15
    other_weight: 0.05
  greedy_initialization_percent: 0.25
  population_restart:
    enabled: true
    trigger_stagnation_gens: 50
    restart_percentage: 0.3
    min_interval_gens: 100
  violation_heatmap:
    enabled: true
    target_hot_genes: true
    top_n_hotspots: 5
    persistence_file: "violation_heatmap.json"
  multi_neighborhood:
    enabled: true
    max_combinations: 10
    fallback_to_single: true

# Enable all Phase 1.5 heuristics (RL will select from these)
heuristics:
  construction:
    largest_degree_first:
      enabled: true
      priority: 1
    most_constrained_first:
      enabled: true
      priority: 2
    earliest_deadline_first:
      enabled: true
      priority: 3

  perturbation:
    random_swap:
      enabled: true
      priority: 1
      swap_type: time
      num_swaps: 1
    temporal_shift:
      enabled: true
      priority: 2
      delta: null
      probability: 0.3
    room_shuffle:
      enabled: true
      priority: 3
      probability: 0.2
    instructor_reassign:
      enabled: true
      priority: 4
      probability: 0.15
      prefer_available: true
    multi_perturbation:
      enabled: true
      priority: 5

  improvement:
    kempe_chain:
      enabled: true
      priority: 1
      max_iterations: 5
    ejection_chain:
      enabled: true
      priority: 2
      max_chain_length: 5
      max_iterations: 3
    variable_depth_search:
      enabled: true
      priority: 3
      max_depth: 3
      max_iterations: 5

  diversity:
    distance_preserving_crossover:
      enabled: true
      priority: 1
      preserve_distance: 0.7
    crowding_mutation:
      enabled: true
      priority: 2
      intensity: 0.3
    niching_selection:
      enabled: true
      priority: 3
      niche_radius: 0.3
      select_count: 10
    adaptive_diversity_maintenance:
      enabled: true
      priority: 4
      diversity_threshold: 0.2

  meta:
    variable_neighborhood_descent:
      enabled: true
      priority: 1
      max_neighborhoods: 3
      max_iterations: 5
    iterated_local_search:
      enabled: true
      priority: 2
      num_iterations: 5
      perturbation_strength: 0.3
    adaptive_large_neighborhood:
      enabled: true
      priority: 3
      num_iterations: 10
      initial_destroy_rate: 0.3
    guided_local_search:
      enabled: true
      priority: 4
      num_iterations: 10
      penalty_factor: 0.1

# Enable RL in inference mode (use trained model)
rl:
  enabled: true
  mode: inference # Options: training, inference, hybrid

  environment:
    max_steps_per_episode: 20
    observation_history_size: 10
    render_mode: null

  reward:
    fitness_weight: 1.0
    diversity_weight: 0.1
    time_weight: 0.01
    normalize: true
    use_hypervolume: true # Phase 2 enhancement

  agent:
    type: ppo # Trained PPO agent
    model_path: models/rl_agents/best_model.zip
    device: cuda # Use GPU for inference (faster)

  inference:
    batch_prediction: false
    timeout_ms: 10
    fallback_on_timeout: true
    cache_predictions: false

  hybrid:
    mode: rl_primary
    fallback_strategy: greedy
    rl_probability: 0.9
    enable_action_masking: true

  logging:
    log_heuristic_usage: true
    log_rewards: true
    log_state_transitions: false
    log_inference_time: true
