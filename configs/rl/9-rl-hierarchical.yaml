# Mode 9: Hierarchical RL
# ENHANCEMENT #7: Two-level policy (high-level: category, low-level: heuristic)

# Inherits from configs/base.yaml

# ================================================
# MODE-SPECIFIC SETTINGS
# ================================================

rl:
  enabled: true

  # Hierarchical policy (NEW)
  hierarchical:
    enabled: true # KILLSWITCH for hierarchical RL
    high_level:
      model_path: "models/rl_agents/high_level_policy.zip"
      categories:
        - construction
        - perturbation
        - improvement
        - diversity
        - meta
    low_level:
      construction_model: "models/rl_agents/low_level_construction.zip"
      perturbation_model: "models/rl_agents/low_level_perturbation.zip"
      improvement_model: "models/rl_agents/low_level_improvement.zip"
      diversity_model: "models/rl_agents/low_level_diversity.zip"
      meta_model: "models/rl_agents/low_level_meta.zip"

  # State encoding
  state:
    type: "constraint_specific"
    enable_constraint_breakdown: true

  # Reward calculation
  reward:
    type: "hypervolume" # Pareto-aware reward
    hypervolume:
      reference_point: [1000, 1000]
      normalization: "dynamic"

# GA configuration
ga:
  population:
    strategy: "hybrid"

  operators:
    crossover:
      probability: 0.7
    mutation:
      probability: 0.2

# Local search configuration
local_search:
  enabled: true
  max_iterations: 10

# Logging
logging:
  verbose: true
  log_category_selections: true
  log_heuristic_hierarchy: true
