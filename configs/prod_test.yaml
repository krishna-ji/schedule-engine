# ============================================================================
# PROD_TEST CONFIGURATION - Standalone Test Production Scale
# ============================================================================
# Test production settings with limited generations to validate performance.
# Use this BEFORE running full production to check resource usage.
# STANDALONE CONFIG: Includes all settings from common.yaml
# 
# Run with: python main.py --config configs/prod_test.yaml
# Expected runtime: 30-60 minutes (30 gens, 100 pop, 2 exhaustive triggers)

name: "Production Test - IGLS System (30 Gen Scale Test)"
environment: test
description: "Standalone test of prod scale (100 pop) with 30 gens to validate resource usage"

# Time Configuration (from common.yaml - production-optimized)
time:
  quantum_minutes: 60
  earliest_preferred_time: "08:00"
  latest_preferred_time: "18:00"
  midday_break_start: "12:00"
  midday_break_end: "13:00"
  max_session_coalescence: 3
  max_sessions_per_day: 6
  preferred_block_size_min: 2
  preferred_block_size_max: 3
  theory_isolated_penalty: 5
  theory_oversized_penalty_per_quantum: 2
  theory_max_excused_isolated: 1
  practical_fragmentation_penalty: 10

# I/O Paths
io:
  data_dir: data
  output_dir: output

# Calendar Display
calendar:
  show_instructor: true
  show_room: true
  show_group: true

# GA Settings - SCALE TEST: 30 gens, 100 population
ga:
  ngen: 30  # Limited gens for quick test
  pop_size: 100  # Full production population to test scale
  cxpb: 0.75
  mutpb: 0.25
  elite_preservation: true
  elite_size: 0.1
  use_adaptive_probabilities: true
  use_constraint_guided_mutation: true
  population_strategy: hybrid
  validate_population_integrity: false

# Parallel Processing - ENABLED for scale test
parallel:
  use_multiprocessing: true
  num_workers: null  # Auto-detect cores

# Feasibility Checks (from common.yaml)
feasibility:
  enable_checks: true
  tolerance_margin: 0.05
  fail_on_infeasibility: false
  generate_report: true
  show_console_output: true
  save_report_on_success: true
  checks:
    instructor_workload:
      enabled: true
      severity: critical
    instructor_qualification_bottleneck:
      enabled: true
      severity: critical
    room_capacity_bottleneck:
      enabled: true
      severity: critical
    room_feature_bottleneck:
      enabled: true
      severity: critical
    group_pigeonhole:
      enabled: true
      severity: critical

# Hard Constraints (from common.yaml - production weights)
hard_constraints:
  no_group_overlap:
    enabled: true
    weight: 3.0
  no_instructor_conflict:
    enabled: true
    weight: 3.0
  instructor_not_qualified:
    enabled: true
    weight: 3.0
  room_type_mismatch:
    enabled: true
    weight: 2.5
  availability_violations:
    enabled: true
    weight: 3.0
  incomplete_or_extra_sessions:
    enabled: true
    weight: 2.0
  session_block_clustering_penalty:
    enabled: true
    weight: 2.0

# Soft Constraints (from common.yaml - production-optimized)
soft_constraints:
  group_gaps_penalty:
    enabled: true
    weight: 1.5
    gap_penalty_per_quantum: 2
  instructor_gaps_penalty:
    enabled: true
    weight: 1.0
    gap_penalty_per_quantum: 1
  group_midday_break_violation:
    enabled: true
    weight: 1.2
    distance_penalty_per_quantum: 2
  soft_weight_factor: 0.01

# IGLS REPAIR SYSTEM (from common.yaml - production settings)
repair:
  enabled: true
  apply_after_mutation: false
  apply_after_crossover: false
  selective_mode: true
  detection_strategy: hybrid
  recheck_after_repair: false
  max_iterations: 2
  memetic_mode: false
  elite_percentage: 0.05
  memetic_iterations: 1
  
  adaptive_repair:
    stagnation_trigger:
      enabled: false
    periodic_trigger:
      enabled: false
  
  # TIER 1: Only 2 triggers for 30-gen test (gen 3 and gen 25)
  exhaustive_search:
    enabled: true
    generations: [3, 25]  # Quick early fix + late refinement
    population_coverage: 0.25
    max_neighborhood_size: 120
    timeout_seconds: 300
  
  # TIER 2: Production stagnation settings
  stagnation_repair:
    enabled: true
    patience: 8
    min_generation: 12
    population_coverage: 0.4
    max_iterations: 15
    timeout_seconds: 120
    cooldown: 5
  
  # TIER 3: Production selective repair
  selective_repair:
    enabled: true
    apply_probability: 0.4
    apply_after_mutation: true
    apply_after_crossover: true
    detection_strategy: hybrid

# Enhancements (all disabled for clean IGLS testing)
enhancements:
  master_enabled: false
  memetic_mode: false
  increased_population: false
  frequent_repair: false
  hypermutation:
    enabled: false
    trigger_on_stagnation: false
    stagnation_window: 10
    duration_generations: 1
    mutation_rate: 0.5
  constraint_priorities:
    enabled: false
    availability_weight: 0.8
    overlap_weight: 0.15
    other_weight: 0.05
  greedy_initialization_percent: 0.0
  population_restart:
    enabled: false
    trigger_stagnation_gens: 50
    restart_percentage: 0.3
    min_interval_gens: 100
  violation_heatmap:
    enabled: false
    target_hot_genes: false
    top_n_hotspots: 5
    persistence_file: "violation_heatmap.json"
  multi_neighborhood:
    enabled: false
    max_combinations: 10
    fallback_to_single: true
