# ================
# RUNTIME MODE D: Adaptive Heuristic Selection (No Memetic)
# ================
# NSGA-II with adaptive heuristic selection based on performance tracking.
# Tests: Can adaptive selection beat fixed round-robin?
# NOTE: No memetic (isolate heuristic selection strategy impact).

metadata:
  runtime_mode: "d-adaptive"
  description: "Mode D: Adaptive heuristic selection"
  category: "hybrid"

ga:
  ngen: 2000
  pop_size: 200
  cxpb: 0.75
  mutpb: 0.25
  elite_preservation: true
  elite_size: 0.1
  use_adaptive_probabilities: true  # Enable adaptive selection
  use_constraint_guided_mutation: true
  population_strategy: random
  validate_population_integrity: false

# Enable IGLS repair (no memetic)
repair:
  enabled: true
  apply_after_mutation: false
  apply_after_crossover: false
  selective_mode: true
  detection_strategy: hybrid
  recheck_after_repair: false
  max_iterations: 2
  memetic_mode: false  # NO memetic - test adaptive strategy only
  elite_percentage: 0.05
  memetic_iterations: 1

  adaptive_repair:
    stagnation_trigger:
      enabled: false
    periodic_trigger:
      enabled: false

  stagnation_repair:
    enabled: true
    patience: 8
    min_generation: 12
    population_coverage: 0.4
    max_iterations: 15
    timeout_seconds: 120
    cooldown: 5

  selective_repair:
    enabled: false

# Enable LNS local search
lns:
  enabled: true
  trigger_interval: 50
  stagnation_threshold: 10
  force_trigger_generations: []
  trigger_before_igls: false
  max_subproblem_size: 20
  min_subproblem_size: 4
  expand_neighborhood_hops: 0
  igls_max_iterations: 500
  igls_time_limit: 5.0
  apply_to_best_n: 1
  enable_diagnostics: true

# Enable enhancements (but not memetic)
enhancements:
  master_enabled: true
  memetic_mode: false  # NO memetic
  increased_population: false
  frequent_repair: false
  hypermutation:
    enabled: true
    trigger_on_stagnation: true
    stagnation_window: 10
    duration_generations: 1
    mutation_rate: 0.5
  constraint_priorities:
    enabled: true
    availability_weight: 0.8
    overlap_weight: 0.15
    other_weight: 0.05
  greedy_initialization_percent: 0.0
  population_restart:
    enabled: true
    trigger_stagnation_gens: 50
    restart_percentage: 0.3
    min_interval_gens: 100
  violation_heatmap:
    enabled: true
    target_hot_genes: true
    top_n_hotspots: 5
    persistence_file: "violation_heatmap.json"
  multi_neighborhood:
    enabled: true
    max_combinations: 10
    fallback_to_single: true

# Enable all 19 heuristics with adaptive selection
heuristics:
  # Enable adaptive priority adjustment (dynamic reordering)
  adaptive_priority:
    enabled: true            # Enable dynamic heuristic reordering
    reorder_interval: 10     # Reorder every 10 generations
    evaluation_window: 10    # Evaluate last 10 generations
    min_applications: 3      # Need 3+ uses before considering
  construction:
    largest_degree_first:
      enabled: true
      priority: 1
    most_constrained_first:
      enabled: true
      priority: 2
    earliest_deadline_first:
      enabled: true
      priority: 3

  perturbation:
    random_swap:
      enabled: true
      priority: 1
      swap_type: time
      num_swaps: 1
    temporal_shift:
      enabled: true
      priority: 2
      delta: null
      probability: 0.3
    room_shuffle:
      enabled: true
      priority: 3
      probability: 0.2
    instructor_reassign:
      enabled: true
      priority: 4
      probability: 0.15
      prefer_available: true
    multi_perturbation:
      enabled: true
      priority: 5

  improvement:
    kempe_chain:
      enabled: true
      priority: 1
      max_iterations: 5
    ejection_chain:
      enabled: true
      priority: 2
      max_chain_length: 5
      max_iterations: 3
    variable_depth_search:
      enabled: true
      priority: 3
      max_depth: 3
      max_iterations: 5

  diversity:
    distance_preserving_crossover:
      enabled: true
      priority: 1
      preserve_distance: 0.7
    crowding_mutation:
      enabled: true
      priority: 2
      intensity: 0.3
    niching_selection:
      enabled: true
      priority: 3
      niche_radius: 0.3
      select_count: 10
    adaptive_diversity_maintenance:
      enabled: true
      priority: 4
      diversity_threshold: 0.2

  meta:
    variable_neighborhood_descent:
      enabled: false  # Too slow
    iterated_local_search:
      enabled: false  # Too slow
    adaptive_large_neighborhood:
      enabled: false  # Too slow
    guided_local_search:
      enabled: false  # Too slow

# Disable RL
rl:
  enabled: false
  mode: disabled
