# ================
# PURE NSGA-II BASELINE - PRODUCTION
# ================
# Clean NSGA-II with NO repairs, NO heuristics, NO enhancements
# Only selection, crossover, mutation, replacement operations
# Use for baseline comparison and pure GA performance measurement

name: "Pure NSGA-II Baseline (Production)"
environment: prod
description: "Clean NSGA-II baseline - NO repairs, NO heuristics, NO enhancements"

# GA Settings - Production scale with improved parameters for constraint problems
ga:
  ngen: 2000
  pop_size: 1000
  cxpb: 0.8  # Higher crossover rate for more exploration
  mutpb: 0.4  # Higher mutation rate to escape local optima
  use_constraint_guided_mutation: true  # Enable constraint-guided mutation for better convergence
  population_strategy: hybrid  # Use hybrid initialization (25% greedy, 50% smart, 25% random)

# DISABLE ALL REPAIRS AND ENHANCEMENTS
repair:
  enabled: false  # Master killswitch
  apply_after_mutation: false
  apply_after_crossover: false
  adaptive_repair:
    stagnation_trigger:
      enabled: false
    periodic_trigger:
      enabled: false
  stagnation_repair:
    enabled: false
  selective_repair:
    enabled: false
    apply_after_mutation: false
    apply_after_crossover: false
  exhaustive_search:
    enabled: false

lns:
  enabled: false

enhancements:
  master_enabled: false
  memetic_mode: false
  hypermutation:
    enabled: false
  population_restart:
    enabled: false
  violation_heatmap:
    enabled: false

# DISABLE ALL HEURISTICS
heuristics:
  construction:
    largest_degree_first:
      enabled: false
    most_constrained_first:
      enabled: false
    earliest_deadline_first:
      enabled: false
  perturbation:
    random_swap:
      enabled: false
    temporal_shift:
      enabled: false
    room_shuffle:
      enabled: false
    instructor_reassign:
      enabled: false
    multi_perturbation:
      enabled: false
  improvement:
    kempe_chain:
      enabled: false
    ejection_chain:
      enabled: false
    variable_depth_search:
      enabled: false
  diversity:
    distance_preserving_crossover:
      enabled: false
    crowding_mutation:
      enabled: false
    niching_selection:
      enabled: false
    adaptive_diversity_maintenance:
      enabled: false
  meta:
    variable_neighborhood_descent:
      enabled: false
    iterated_local_search:
      enabled: false
    adaptive_large_neighborhood:
      enabled: false
    guided_local_search:
      enabled: false

# RL Integration - Disabled
rl:
  enabled: false