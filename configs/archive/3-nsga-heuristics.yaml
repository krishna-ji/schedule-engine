# ================
# RUNTIME MODE 3: NSGA-II + Repairs + Small Heuristics
# ================
# GA with repairs + Phase 1.5 heuristic toolbox (19 operators).
# Tests effectiveness of heuristic operators without advanced enhancements.

ga:
  ngen: 2000
  pop_size: 200
  cxpb: 0.75
  mutpb: 0.25
  elite_preservation: true
  elite_size: 0.1
  use_adaptive_probabilities: false
  use_constraint_guided_mutation: true # Constraint-guided mutation enabled
  population_strategy: random # Random init for fair comparison (smart init produces worse solutions)
  validate_population_integrity: false

# Enable IGLS repair system
repair:
  enabled: true
  apply_after_mutation: false
  apply_after_crossover: false
  selective_mode: true
  detection_strategy: hybrid
  recheck_after_repair: false
  max_iterations: 2
  memetic_mode: false

  adaptive_repair:
    stagnation_trigger:
      enabled: false
    periodic_trigger:
      enabled: false

  stagnation_repair:
    enabled: true
    patience: 8
    min_generation: 12
    population_coverage: 0.4
    max_iterations: 15
    timeout_seconds: 120
    cooldown: 5

  selective_repair:
    enabled: true
    apply_probability: 0.4
    apply_after_mutation: true
    apply_after_crossover: true
    detection_strategy: hybrid

# Disable LNS
lns:
  enabled: false

# Disable enhancements
enhancements:
  master_enabled: false
  memetic_mode: false
  increased_population: false
  frequent_repair: false
  hypermutation:
    enabled: false
  constraint_priorities:
    enabled: false
  greedy_initialization_percent: 0.0
  population_restart:
    enabled: false
  violation_heatmap:
    enabled: false
  multi_neighborhood:
    enabled: false

# Enable Phase 1.5 heuristics (19 operators)
heuristics:
  construction:
    largest_degree_first:
      enabled: true
      priority: 1
    most_constrained_first:
      enabled: true
      priority: 2
    earliest_deadline_first:
      enabled: true
      priority: 3

  perturbation:
    random_swap:
      enabled: true
      priority: 1
      swap_type: time
      num_swaps: 1
    temporal_shift:
      enabled: true
      priority: 2
      delta: null
      probability: 0.3
    room_shuffle:
      enabled: true
      priority: 3
      probability: 0.2
    instructor_reassign:
      enabled: true
      priority: 4
      probability: 0.15
      prefer_available: true
    multi_perturbation:
      enabled: false # Not used in fixed heuristic mode

  improvement:
    kempe_chain:
      enabled: true
      priority: 1
      max_iterations: 5
    ejection_chain:
      enabled: true
      priority: 2
      max_chain_length: 5
      max_iterations: 3
    variable_depth_search:
      enabled: true
      priority: 3
      max_depth: 3
      max_iterations: 5

  diversity:
    distance_preserving_crossover:
      enabled: true
      priority: 1
      preserve_distance: 0.7
    crowding_mutation:
      enabled: true
      priority: 2
      intensity: 0.3
    niching_selection:
      enabled: true
      priority: 3
      niche_radius: 0.3
      select_count: 10
    adaptive_diversity_maintenance:
      enabled: true
      priority: 4
      diversity_threshold: 0.2

  meta:
    variable_neighborhood_descent:
      enabled: true
      priority: 1
      max_neighborhoods: 3
      max_iterations: 5
    iterated_local_search:
      enabled: true
      priority: 2
      num_iterations: 5
      perturbation_strength: 0.3
    adaptive_large_neighborhood:
      enabled: true
      priority: 3
      num_iterations: 10
      initial_destroy_rate: 0.3
    guided_local_search:
      enabled: true
      priority: 4
      num_iterations: 10
      penalty_factor: 0.1

# Disable RL
rl:
  enabled: false
  mode: disabled
