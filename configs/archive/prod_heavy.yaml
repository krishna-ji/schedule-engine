# ================
# HEAVY PRODUCTION - CPU/RAM STRESS TEST
# ================
# Designed for 128GB RAM + High Core Count CPUs.
# Maximizes parallel efficiency by increasing population size.

name: "Production - Heavy Workload"
environment: prod
description: "High-load production run (5000 pop) to saturate CPU/RAM"

# GA Settings - Massive population to saturate cores
ga:
  ngen: 1000 # Fewer generations needed with massive population
  pop_size: 5000 # 6x larger than standard prod (uses ~10-20GB RAM)

# Parallel Processing
parallel:
  use_multiprocessing: true
  num_workers: null # Auto-detect (uses ALL cores)

# Repair Settings - Scale up for larger population
repair:
  exhaustive_search:
    enabled: true
    generations: [10, 50, 100, 200, 500]
    population_coverage: 0.05 # Top 5% of 5000 = 250 individuals (Heavy!)
    max_neighborhood_size: 200
    timeout_seconds: 3600

  stagnation_repair:
    patience: 20
    population_coverage: 0.10 # Top 10% = 500 individuals
    max_iterations: 20

# LNS - Heavy duty
lns:
  enabled: true
  trigger_interval: 50
  apply_to_best_n: 10 # Repair top 10 individuals
  max_subproblem_size: 50 # Larger subproblems
